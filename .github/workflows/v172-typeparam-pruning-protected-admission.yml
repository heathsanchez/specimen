name: V172 typeparam pruning protected admission
on:
  push:
    branches: ["v172-typeparam-pruning-protected-admission"]
    paths: ['.github/workflows/v172-typeparam-pruning-protected-admission.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with: {build: false, test: false, lint: false}
      - name: Freeze hashes and apparatus
        run: |
          set -euo pipefail
          lake --version
          sha256sum protocols/V172_TYPEPARAM_PRUNING_PROTECTED_ADMISSION.md \
            fixtures/V170_ISSUE19_PARAMETER_OVERCONSTRAINT.lean \
            fixtures/V171_GENERATED_TYPE_SAFETY.lean fixtures/V171_EQUALITY_TYPEPARAM_SAFETY.lean \
            scripts/v120_apply_binder_aware_fixed_parameter.py scripts/v132_apply_output_dependent_input_determined.py \
            scripts/v156_apply_requirement_provenance_promotion.py scripts/v156b_apply_checker_consumer_compat.py \
            scripts/v158_apply_scope_dependent_promotion.py scripts/v168_apply_certified_constructor_irrefutability.py \
            scripts/v171_apply_delete_default_typeparam_constraints.py | tee v172_hashes.txt
      - name: Define frozen helpers
        run: |
          cat > /tmp/v172.sh <<'SH'
          set -euo pipefail
          prior() {
            python scripts/v120_apply_binder_aware_fixed_parameter.py
            python scripts/v132_apply_output_dependent_input_determined.py
            python scripts/v156_apply_requirement_provenance_promotion.py
            python scripts/v156b_apply_checker_consumer_compat.py
            python scripts/v158_apply_scope_dependent_promotion.py
            python scripts/v168_apply_certified_constructor_irrefutability.py
          }
          clean() { git checkout HEAD -- Specimen SpecimenTest; rm -rf .lake/build; }
          build() { lake build Plausible Specimen; }
          probe() { local f="$1" p="$2"; set +e; lake env lean "$f" > "$p.log" 2>&1; local r=$?; set -e; echo "$r" > "$p.rc"; }
          SH
      - name: Arm A prior stack
        run: |
          source /tmp/v172.sh
          clean; prior > v172_A_apply.log 2>&1; build > v172_A_build.log 2>&1
          probe fixtures/V170_ISSUE19_PARAMETER_OVERCONSTRAINT.lean v172_A_natural
          probe fixtures/V171_GENERATED_TYPE_SAFETY.lean v172_A_generated
          probe fixtures/V171_EQUALITY_TYPEPARAM_SAFETY.lean v172_A_equality
      - name: Arm B pruning intervention and protected gate
        run: |
          source /tmp/v172.sh
          clean; prior > v172_B_prior.log 2>&1
          python scripts/v171_apply_delete_default_typeparam_constraints.py | tee v172_B_delete.log
          grep -q V171_DEFAULT_TYPEPARAM_CONSTRAINTS_DELETED_ALL_EMITTERS v172_B_delete.log
          build > v172_B_build.log 2>&1
          probe fixtures/V170_ISSUE19_PARAMETER_OVERCONSTRAINT.lean v172_B_natural
          probe fixtures/V171_GENERATED_TYPE_SAFETY.lean v172_B_generated
          probe fixtures/V171_EQUALITY_TYPEPARAM_SAFETY.lean v172_B_equality
          set +e
          lake test > v172_B_test.log 2>&1
          echo $? > v172_B_test.rc
          set -e
      - name: Arm C independent ablation
        if: always()
        run: |
          source /tmp/v172.sh
          clean; prior > v172_C_apply.log 2>&1; build > v172_C_build.log 2>&1
          probe fixtures/V170_ISSUE19_PARAMETER_OVERCONSTRAINT.lean v172_C_natural
      - name: Frozen V172 classification
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          def arm(p):
            rp=pathlib.Path(p+'.rc'); lp=pathlib.Path(p+'.log')
            rc=int(rp.read_text().strip()) if rp.exists() else None
            log=lp.read_text(errors='replace') if lp.exists() else ''
            return {'rc':rc,'failed_synth':'failed to synthesize' in log.lower(),'tail':log[-1600:]}
          A={k:arm('v172_A_'+k) for k in ['natural','generated','equality']}
          B={k:arm('v172_B_'+k) for k in ['natural','generated','equality']}
          C={'natural':arm('v172_C_natural')}
          test_rc=int(pathlib.Path('v172_B_test.rc').read_text().strip()) if pathlib.Path('v172_B_test.rc').exists() else None
          apparatus=not all(pathlib.Path(x).exists() for x in ['v172_A_build.log','v172_B_build.log','v172_B_delete.log','v172_C_build.log','v172_B_test.rc'])
          gates={
            'A_natural_fails':A['natural']['rc'] not in (None,0),
            'A_generated_passes':A['generated']['rc']==0,
            'A_equality_passes':A['equality']['rc']==0,
            'B_natural_rescued':B['natural']['rc']==0,
            'B_generated_passes':B['generated']['rc']==0,
            'B_equality_passes':B['equality']['rc']==0,
            'B_protected_tests_pass':test_rc==0,
            'C_natural_restores':C['natural']['rc'] not in (None,0),
          }
          if apparatus: verdict='R10_V172_INCONCLUSIVE'
          elif all(gates.values()): verdict='PASS_V172_PRUNING_CLOSURE_ADMITTED'
          elif gates['B_natural_rescued'] and not gates['B_protected_tests_pass']: verdict='NEGATIVE_V172_PRUNING_NOT_ADMITTED'
          else: verdict='NEGATIVE_V172_PRUNING_NOT_SUFFICIENT'
          out={'canonical_id':'V172_TYPEPARAM_PRUNING_PROTECTED_ADMISSION','apparatus':apparatus,'gates':gates,'test_rc':test_rc,'A':A,'B':B,'C':C,'verdict':verdict}
          pathlib.Path('v172_result.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - name: Diagnostics
        if: always()
        run: |
          cat v172_result.json || true
          tail -120 v172_B_test.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v172-typeparam-pruning-protected-admission, path: 'v172*', retention-days: 90}
