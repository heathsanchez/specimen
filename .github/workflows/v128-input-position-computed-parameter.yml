name: V128 input-position computed parameter acquisition

on:
  push:
    branches: ["v120-binder-aware-fixed-parameter"]
  workflow_dispatch:

jobs:
  acquisition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: "false"
          test: "false"

      - name: Prepare frozen discriminator arms
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('SpecimenTest/V126ComputedParameterBridgeDiscriminator.lean').read_text()
          common=src.split('/-- ID arm. -/',1)[0]
          Path('/tmp/V126ID.lean').write_text(common + 'derive_mutual (fun (p : V126Base) (n : Nat) => ∃ b : V126BoxId p, V126HasId b n)\n')
          Path('/tmp/V126MAP.lean').write_text(common + 'derive_mutual (fun (p : V126Base) (n : Nat) => ∃ b : V126BoxMap (V126Lift p), V126HasMap b n)\n')
          src=Path('SpecimenTest/V125UniverseLevelScheduleDiscriminator.lean').read_text()
          common=src.split('/-- U0: structurally matched task whose fixed parameter carrier lives in `Type`. -/',1)[0]
          Path('/tmp/V125U1.lean').write_text(common + 'derive_mutual (fun (p : V125P1) (n : Nat) => ∃ b : V125Box1 p, V125Has1 b n)\n')
          PY

      - name: Apply exact frozen V120 K2 and reproduce V126 MAP obstruction
        shell: bash
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          lake build Specimen.DeriveConstrainedProducer
          set +e
          lake env lean /tmp/V126MAP.lean > v128_k2_map.log 2>&1
          K2_MAP=$?
          set -e
          echo "K2_MAP=$K2_MAP"
          if [ "$K2_MAP" -eq 0 ]; then
            echo "INVALID_V126_MAP_OBSTRUCTION_NOT_REPRODUCED"
            exit 91
          fi

      - name: Apply frozen V128 K4
        run: |
          python scripts/v128_apply_input_position_computed_parameter.py
          git diff -- Specimen/DeriveConstrainedProducer.lean | tee v128_k4.patch
          if grep -Eq 'Strata|mono|V126|V126Lift|LExprParamsT' v128_k4.patch; then
            echo "INVALID_TARGET_SPECIFIC_K4"
            exit 92
          fi
          lake build Specimen.DeriveConstrainedProducer
          lake build

      - name: Test K4 acquisition and controls
        shell: bash
        run: |
          set +e
          lake env lean /tmp/V126MAP.lean > v128_k4_map.log 2>&1; K4_MAP=$?
          lake env lean /tmp/V126ID.lean > v128_k4_id.log 2>&1; K4_ID=$?
          lake env lean /tmp/V125U1.lean > v128_k4_u1.log 2>&1; K4_U1=$?
          lake env lean SpecimenTest/V119ExplicitIndexControl.lean > v128_k4_explicit.log 2>&1; K4_EXPLICIT=$?
          lake env lean SpecimenTest/V119ImplicitParameterAcquisition.lean > v128_k4_implicit.log 2>&1; K4_IMPLICIT=$?
          lake env lean SpecimenTest/V122FieldCarryingUniformParameter.lean > v128_k4_a.log 2>&1; K4_A=$?
          lake env lean SpecimenTest/V122RecursiveUniformParameter.lean > v128_k4_b.log 2>&1; K4_B=$?
          set -e
          echo "K4_MAP=$K4_MAP K4_ID=$K4_ID K4_U1=$K4_U1 K4_EXPLICIT=$K4_EXPLICIT K4_IMPLICIT=$K4_IMPLICIT K4_A=$K4_A K4_B=$K4_B"
          cat v128_k4_map.log
          printf '{"k2_map":1,"k4_map":%s,"k4_id":%s,"k4_u1":%s,"k4_explicit":%s,"k4_implicit":%s,"k4_a":%s,"k4_b":%s' \
            "$K4_MAP" "$K4_ID" "$K4_U1" "$K4_EXPLICIT" "$K4_IMPLICIT" "$K4_A" "$K4_B" > v128_result.json.part
          if [ "$K4_MAP" -ne 0 ] || [ "$K4_ID" -ne 0 ] || [ "$K4_U1" -ne 0 ] || [ "$K4_EXPLICIT" -ne 0 ] || [ "$K4_IMPLICIT" -ne 0 ] || [ "$K4_A" -ne 0 ] || [ "$K4_B" -ne 0 ]; then
            echo "NULL_OR_HARMFUL_V128_K4"
            exit 93
          fi

      - name: Ablate K4 while retaining K2
        shell: bash
        run: |
          git checkout -- Specimen/DeriveConstrainedProducer.lean
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          lake build Specimen.DeriveConstrainedProducer
          set +e
          lake env lean /tmp/V126MAP.lean > v128_ablate_map.log 2>&1
          ABLATE_MAP=$?
          set -e
          echo "ABLATE_MAP=$ABLATE_MAP"
          printf ',"ablate_map":%s}\n' "$ABLATE_MAP" >> v128_result.json.part
          mv v128_result.json.part v128_result.json
          if [ "$ABLATE_MAP" -eq 0 ]; then
            echo "NULL_V128_ABLATION_NO_CAUSALITY"
            exit 94
          fi
          echo "PASS_V128_INPUT_POSITION_COMPUTED_PARAMETER_ACQUISITION"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v128-input-position-computed-parameter
          path: |
            v128_result.json
            v128_k4.patch
            v128_k2_map.log
            v128_k4_map.log
            v128_k4_id.log
            v128_k4_u1.log
            v128_k4_explicit.log
            v128_k4_implicit.log
            v128_k4_a.log
            v128_k4_b.log
            v128_ablate_map.log
