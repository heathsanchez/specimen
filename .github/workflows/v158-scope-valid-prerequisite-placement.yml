name: V158 scope-valid prerequisite placement

on:
  push:
    branches: ["v158-scope-valid-prerequisite-placement"]
    paths:
      - '.github/workflows/v158-scope-valid-prerequisite-placement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with: {build: default, test: false, lint: false}

      - name: Apply admitted K2 K5 and freeze fixtures
        run: |
          set -o pipefail
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          lake build Specimen.DeriveConstrainedProducer
          cat > /tmp/V158A.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V153P where Meta : Type
          abbrev V153P0 : V153P := ⟨Unit⟩
          inductive V153Box (p : V153P) : Type where | mk : p.Meta → V153Box p
          inductive V153Has {p : V153P} : V153Box p → Prop where | mk (x : p.Meta) : V153Has (V153Box.mk x)
          derive_generator (fun (p : V153P) => ∃ b : V153Box p, V153Has b)
          #synth ArbitrarySizedSuchThat (V153Box V153P0) (fun b => V153Has b)
          EOF
          cat > /tmp/V158B.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V153Q where Carrier : Type
          abbrev V153Q0 : V153Q := ⟨Bool⟩
          inductive V153Packet (q : V153Q) : Type where | pack : q.Carrier → V153Packet q
          inductive V153Accepts {q : V153Q} : V153Packet q → Prop where | accept (x : q.Carrier) : V153Accepts (V153Packet.pack x)
          derive_generator (fun (q : V153Q) => ∃ p : V153Packet q, V153Accepts p)
          #synth ArbitrarySizedSuchThat (V153Packet V153Q0) (fun p => V153Accepts p)
          EOF
          cat > /tmp/V158C.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V156Pair where
            A : Type
            B : Type
          abbrev V156Pair0 : V156Pair := ⟨Unit, Bool⟩
          inductive V156Box2 (p : V156Pair) : Type where
            | mk : p.A → p.B → V156Box2 p
          inductive V156Has2 {p : V156Pair} : V156Box2 p → Prop where
            | mk (a : p.A) (b : p.B) : V156Has2 (V156Box2.mk a b)
          derive_generator (fun (p : V156Pair) => ∃ x : V156Box2 p, V156Has2 x)
          #synth ArbitrarySizedSuchThat (V156Box2 V156Pair0) (fun x => V156Has2 x)
          EOF
          sha256sum /tmp/V158A.lean /tmp/V158B.lean /tmp/V158C.lean \
            SpecimenTest/DeriveArbitrarySuchThat/InstanceParameterTest.lean \
            SpecimenTest/DeriveArbitrarySuchThat/MutuallyRecursiveRelationsTest.lean \
            SpecimenTest/DeriveArbitrarySuchThat/DependentArgs.lean \
            SpecimenTest/DeriveArbitrarySuchThat/DeriveSTLCGenerator.lean \
            SpecimenTest/StrataLexprGen.lean \
            SpecimenTest/ScheduleQualityRegressionTest.lean | tee v158_fixture_hashes.txt
          sha256sum protocols/V158_SCOPE_VALID_PREREQUISITE_PLACEMENT_PRECOMMIT.md \
            protocols/V158A_SCOPE_OPERATIONALIZATION_ADDENDUM.md \
            protocols/V158B_SYNTAX_WALKER_TERMINATION_APPARATUS_ADDENDUM.md \
            scripts/v156_apply_requirement_provenance_promotion.py \
            scripts/v156b_apply_checker_consumer_compat.py \
            scripts/v158_apply_scope_dependent_promotion.py | tee v158_protocol_hashes.txt

      - name: Baseline ablation record
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          p=subprocess.run(['lake','env','lean','/tmp/V158A.lean'],capture_output=True,text=True)
          log=p.stdout+p.stderr; pathlib.Path('v158_baseline.log').write_text(log); lo=log.lower()
          if p.returncode==0: c='PASS'
          elif 'failed to synthesize' in lo and 'meta' in lo: c='SYMBOLIC_INSTANCE'
          elif 'expected to be a variable' in lo: c='NON_FVAR_APPLICABILITY'
          else: c='OTHER_FAILURE'
          r={'rc':p.returncode,'class':c}
          pathlib.Path('v158_baseline.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r,indent=2))
          PY

      - name: Apply frozen V156 representation and V158 scope rule
        run: |
          set -o pipefail
          python scripts/v156_apply_requirement_provenance_promotion.py | tee v158_v156_apply.log
          python scripts/v156b_apply_checker_consumer_compat.py | tee v158_v156b_adapter.log
          python scripts/v158_apply_scope_dependent_promotion.py | tee v158_apply.log
          grep -q 'REQUIREMENT_PROVENANCE_PROMOTION_APPLIED' v158_v156_apply.log
          grep -q 'V156B_CHECKER_CONSUMER_COMPAT_APPLIED' v158_v156b_adapter.log
          grep -q 'SCOPE_DEPENDENT_REQUIREMENT_PROMOTION_APPLIED' v158_apply.log
          grep -q 'partial def v158SyntaxMentionsInput' Specimen/DeriveConstrainedProducer.lean
          grep -q 'v158SyntaxMentionsInput req.term.raw freshenedInputNamesExcludingOutput' Specimen/DeriveConstrainedProducer.lean
          grep -q 'origin := .unconstrained' Specimen/MExp.lean
          grep -q 'origin := .constrained' Specimen/MExp.lean
          grep -q 'k6_required_outer_' Specimen/MakeConstrainedProducerInstance.lean
          grep -q 'k6_required_inner_' Specimen/MakeConstrainedProducerInstance.lean
          sha256sum Specimen/MExp.lean Specimen/MakeConstrainedProducerInstance.lean \
            Specimen/DeriveConstrainedProducer.lean Specimen/DeriveChecker.lean | tee v158_impl_hashes.txt
          lake build Specimen.MExp Specimen.MakeConstrainedProducerInstance Specimen.DeriveConstrainedProducer Specimen.DeriveChecker

      - name: Run frozen discriminator suite
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          out={}
          temp_cases={
            'PRIMARY':'/tmp/V158A.lean',
            'HELDOUT':'/tmp/V158B.lean',
            'MULTI':'/tmp/V158C.lean',
          }
          for name,path in temp_cases.items():
            p=subprocess.run(['lake','env','lean',path],capture_output=True,text=True)
            log=p.stdout+p.stderr; pathlib.Path(f'v158_{name}.log').write_text(log)
            lo=log.lower()
            c='PASS' if p.returncode==0 else ('SYNTH_FAILURE' if 'failed to synthesize' in lo else ('UNKNOWN_IDENTIFIER' if 'unknown identifier' in lo else 'OTHER_FAILURE'))
            out[name]={'rc':p.returncode,'class':c}
          module_cases={
            'INSTANCE_PARAMETER':'SpecimenTest.DeriveArbitrarySuchThat.InstanceParameterTest',
            'MUTUAL':'SpecimenTest.DeriveArbitrarySuchThat.MutuallyRecursiveRelationsTest',
            'DEPENDENT_ARGS':'SpecimenTest.DeriveArbitrarySuchThat.DependentArgs',
            'STLC':'SpecimenTest.DeriveArbitrarySuchThat.DeriveSTLCGenerator',
            'STRATA':'SpecimenTest.StrataLexprGen',
            'SCHEDULE_QUALITY':'SpecimenTest.ScheduleQualityRegressionTest',
          }
          for name,target in module_cases.items():
            p=subprocess.run(['lake','build',target],capture_output=True,text=True)
            log=p.stdout+p.stderr; pathlib.Path(f'v158_{name}.log').write_text(log)
            out[name]={'rc':p.returncode,'class':'PASS' if p.returncode==0 else 'FAIL'}
          pathlib.Path('v158_arms.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Full protected behavior
        continue-on-error: true
        run: |
          set +e
          lake build > v158_build.log 2>&1; B=$?
          lake test > v158_test.log 2>&1; T=$?
          set -e
          printf '{"build":%s,"test":%s}\n' "$B" "$T" > v158_protected.json

      - name: Frozen V158 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def load(p): return json.loads(pathlib.Path(p).read_text()) if pathlib.Path(p).exists() else None
          b=load('v158_baseline.json'); a=load('v158_arms.json'); p=load('v158_protected.json')
          applied=pathlib.Path('v158_apply.log').exists() and 'SCOPE_DEPENDENT_REQUIREMENT_PROMOTION_APPLIED' in pathlib.Path('v158_apply.log').read_text()
          apparatus=b is None or a is None or p is None or not pathlib.Path('v158_impl_hashes.txt').exists() or not applied
          if apparatus:
            r={'canonical_id':'V158_SCOPE_VALID_PREREQUISITE_PLACEMENT','verdict':'R10_V158_INCONCLUSIVE','earned_capability':None}
          else:
            gates={
              'G1_baseline_symbolic':b.get('class')=='SYMBOLIC_INSTANCE',
              'G2_primary_pass':a['PRIMARY'].get('class')=='PASS',
              'G3_heldout_pass':a['HELDOUT'].get('class')=='PASS',
              'G4_multi_pass':a['MULTI'].get('class')=='PASS',
              'G5_instance_parameter_pass':a['INSTANCE_PARAMETER'].get('class')=='PASS',
              'G6_mutual_pass':a['MUTUAL'].get('class')=='PASS',
              'G7_dependent_args_pass':a['DEPENDENT_ARGS'].get('class')=='PASS',
              'G8_stlc_pass':a['STLC'].get('class')=='PASS',
              'G9_strata_pass':a['STRATA'].get('class')=='PASS',
              'G10_schedule_quality_pass':a['SCHEDULE_QUALITY'].get('class')=='PASS',
              'G11_build_pass':p.get('build')==0,
              'G12_test_pass':p.get('test')==0,
              'G13_ablation_restores_failure':b.get('class')=='SYMBOLIC_INSTANCE',
              'G14_generic_scope_rule':True,
            }
            v='PASS_V158_SCOPE_VALID_PLACEMENT_ADMITTED_SCOPED' if all(gates.values()) else 'NEGATIVE_V158_SCOPE_VALID_PLACEMENT_NOT_ADMITTED'
            r={'canonical_id':'V158_SCOPE_VALID_PREREQUISITE_PLACEMENT','baseline':b,'arms':a,'protected':p,'gates':gates,'verdict':v,'earned_capability':'K6_SCOPE_DEPENDENT_REQUIREMENT_PROMOTION' if v.startswith('PASS') else None,'claim_boundary':'Scoped K6 only; constructor development still requires later-frontier causal dependence.'}
          pathlib.Path('v158_result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Diagnostics
        if: always()
        run: |
          cat v158_result.json || true
          [ -f v158_apply.log ] && cat v158_apply.log || true
          for f in v158_PRIMARY.log v158_HELDOUT.log v158_MULTI.log v158_DEPENDENT_ARGS.log v158_STLC.log v158_STRATA.log v158_SCHEDULE_QUALITY.log; do
            [ -f "$f" ] && { echo ==== $f ====; tail -120 "$f"; }
          done
          [ -f v158_test.log ] && tail -220 v158_test.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v158-scope-valid-prerequisite-placement
          path: v158_*
          if-no-files-found: warn
          retention-days: 90
