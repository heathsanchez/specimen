name: V169 V167 probe apparatus repair

on:
  push:
    branches: ["v169-v167-probe-apparatus-repair"]
    paths:
      - '.github/workflows/v169-v167-probe-apparatus-repair.yml'
      - 'experiments/V169_V167_PROBE_APPARATUS_REPAIR_PREREG.md'
  workflow_dispatch:

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: "false"
          test: "false"
      - name: Apply exact admitted K2 K5 only
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          lake build Specimen.Utils Specimen.DeriveConstrainedProducer
      - name: Freeze repaired V167 probe
        run: |
          cat > /tmp/V169.lean <<'EOF'
          import Specimen.DeriveConstrainedProducer
          import Specimen.Utils
          open Lean Meta Elab Command Term

          inductive V169Plain (α : Type) : Option α → Prop where
            | none : V169Plain α none

          structure V169P where
            A : Type
          inductive V169Struct (p : V169P) : Option p.A → Prop where
            | none : V169Struct p none

          private def classifyRaw (n : Name) : TermElabM String := do
            let info ← getConstInfo n
            let cs ← getComponentsOfArrowType info.type
            if h : 1 < cs.size then
              try
                let _ ← inferType cs[1]
                pure "LIVE"
              catch _ => pure "STALE"
            else pure "MISSING"

          private def classifySequential (n : Name) : TermElabM String := do
            let info ← getConstInfo n
            let levels := info.levelParams.map (fun nm => Level.param nm)
            forallTelescope info.type fun fvars _ => do
              let tys ← getCorrectTypes fvars n levels
              if h : 1 < tys.size then
                try
                  let _ ← inferType tys[1]
                  pure "LIVE"
                catch _ => pure "STALE"
              else pure "MISSING"

          elab "v169_probe" : command => do
            let pRaw ← liftTermElabM <| classifyRaw ``V169Plain
            let sRaw ← liftTermElabM <| classifyRaw ``V169Struct
            let pSeq ← liftTermElabM <| classifySequential ``V169Plain
            let sSeq ← liftTermElabM <| classifySequential ``V169Struct
            logInfo m!"V169_PLAIN_RAW={pRaw}"
            logInfo m!"V169_STRUCT_RAW={sRaw}"
            logInfo m!"V169_PLAIN_SEQ={pSeq}"
            logInfo m!"V169_STRUCT_SEQ={sSeq}"

          v169_probe
          EOF
      - name: Execute repaired liveness probe
        continue-on-error: true
        run: |
          set +e; lake env lean /tmp/V169.lean > v169_probe.log 2>&1; RC=$?; set -e
          echo $RC > v169_probe_rc.txt
          cat v169_probe.log
          exit 0
      - name: Protected suite
        continue-on-error: true
        run: |
          set +e; lake build > v169_build.log 2>&1; B=$?; lake test > v169_test.log 2>&1; T=$?; set -e
          printf '{"build":%s,"test":%s}\n' "$B" "$T" > v169_protected.json
          exit 0
      - name: Frozen V169 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib,re
          log=pathlib.Path('v169_probe.log').read_text() if pathlib.Path('v169_probe.log').exists() else ''
          rc=int(pathlib.Path('v169_probe_rc.txt').read_text()) if pathlib.Path('v169_probe_rc.txt').exists() else 999
          p=json.loads(pathlib.Path('v169_protected.json').read_text()) if pathlib.Path('v169_protected.json').exists() else None
          keys=['V169_PLAIN_RAW','V169_STRUCT_RAW','V169_PLAIN_SEQ','V169_STRUCT_SEQ']
          vals={k:(re.search(k+r'=(LIVE|STALE|MISSING)',log).group(1) if re.search(k+r'=(LIVE|STALE|MISSING)',log) else None) for k in keys}
          if rc!=0 or p is None or any(x is None for x in vals.values()):v='R10_PROBE_OR_SETUP_FAILURE'
          elif p.get('build')!=0 or p.get('test')!=0:v='R10_PROTECTED_FAILURE'
          elif vals=={'V169_PLAIN_RAW':'STALE','V169_STRUCT_RAW':'STALE','V169_PLAIN_SEQ':'LIVE','V169_STRUCT_SEQ':'LIVE'}:v='PASS_V169_RAW_COMPONENTS_STALE_BUT_SEQUENTIAL_LIVE'
          elif vals['V169_PLAIN_RAW']=='LIVE' and vals['V169_STRUCT_RAW']=='STALE' and vals['V169_PLAIN_SEQ']=='LIVE' and vals['V169_STRUCT_SEQ']=='LIVE':v='PASS_V169_STRUCTURE_ONLY_RAW_STALE'
          else:v='V169_RAW_COMPONENTS_NOT_SOURCE'
          r={'canonical_id':'V169_V167_PROBE_APPARATUS_REPAIR','values':vals,'probe_rc':rc,'protected':p,'verdict':v,'claim_boundary':'Mechanism localization only; no production repair.'}
          pathlib.Path('v169_result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n'); print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Diagnostics
        if: always()
        run: |
          cat v169_result.json || true
          cat v169_probe.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v169-v167-probe-apparatus-repair
          path: v169_*
