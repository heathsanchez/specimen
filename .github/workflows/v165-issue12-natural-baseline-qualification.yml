name: V165 issue12 natural baseline qualification
on:
  push:
    branches: ["v165-issue12-natural-baseline-qualification"]
    paths: ['.github/workflows/v165-issue12-natural-baseline-qualification.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with: {build: default, test: false, lint: false}
      - name: Freeze fixture and prior-stack identity
        run: |
          sha256sum protocols/V165_ISSUE12_NATURAL_BASELINE_QUALIFICATION.md fixtures/V165_UPSTREAM_ISSUE12_REPRO.lean scripts/v120_apply_binder_aware_fixed_parameter.py scripts/v132_apply_output_dependent_input_determined.py scripts/v156_apply_requirement_provenance_promotion.py scripts/v156b_apply_checker_consumer_compat.py scripts/v158_apply_scope_dependent_promotion.py | tee v165_hashes.txt
          lake build Plausible Specimen
      - name: Apply exact admitted prior stack
        run: |
          set -o pipefail
          git checkout HEAD -- Specimen SpecimenTest
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          python scripts/v156_apply_requirement_provenance_promotion.py | tee v165_v156.log
          python scripts/v156b_apply_checker_consumer_compat.py | tee v165_v156b.log
          python scripts/v158_apply_scope_dependent_promotion.py | tee v165_v158.log
          grep -q REQUIREMENT_PROVENANCE_PROMOTION_APPLIED v165_v156.log
          grep -q V156B_CHECKER_CONSUMER_COMPAT_APPLIED v165_v156b.log
          grep -q SCOPE_DEPENDENT_REQUIREMENT_PROMOTION_APPLIED v165_v158.log
          rm -rf .lake/build
          lake build Plausible Specimen > v165_rebuild.log 2>&1
      - name: Execute exact issue12 fixture
        run: |
          set +e
          lake env lean fixtures/V165_UPSTREAM_ISSUE12_REPRO.lean > v165.log 2>&1
          RC=$?
          set -e
          echo "$RC" > v165_rc.txt
      - name: Frozen V165 classification
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          rc=int(pathlib.Path('v165_rc.txt').read_text().strip()) if pathlib.Path('v165_rc.txt').exists() else None
          log=pathlib.Path('v165.log').read_text(errors='replace') if pathlib.Path('v165.log').exists() else ''
          lo=log.lower()
          applied=all(pathlib.Path(x).exists() for x in ['v165_v156.log','v165_v156b.log','v165_v158.log'])
          apparatus=(rc is None or not applied or any(x in lo for x in ['unknown module prefix','object file']))
          redundant=('redundantmatchalt' in lo or 'redundant alternative' in lo)
          missing=('failed to synthesize' in lo)
          if apparatus: verdict='R10_V165_INCONCLUSIVE'
          elif rc==0: verdict='NULL_V165_ISSUE12_ALREADY_SOLVED'
          elif redundant: verdict='PASS_V165_ISSUE12_NATURAL_FRONTIER_QUALIFIED'
          elif missing: verdict='NEGATIVE_V165_DIFFERENT_MISSING_PREREQUISITE'
          else: verdict='INCONCLUSIVE_V165_DIFFERENT_RESIDUAL'
          out={'canonical_id':'V165_ISSUE12_NATURAL_BASELINE_QUALIFICATION','rc':rc,'apparatus':apparatus,'redundant_match_alt':redundant,'missing_instance':missing,'verdict':verdict,'log_tail':log[-6000:]}
          pathlib.Path('v165_result.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - name: Diagnostics
        if: always()
        run: |
          cat v165_result.json || true
          tail -180 v165.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v165-issue12-natural-baseline-qualification, path: 'v165*', retention-days: 90}
