name: V124 direct Strata known-world validation

on:
  push:
    branches: ["v120-binder-aware-fixed-parameter"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: "false"
          test: "false"
      - name: K0 direct real-Strata target
        shell: bash
        run: |
          set +e
          lake env lean SpecimenTest/V124DirectStrataLExpr.lean > v124_k0.log 2>&1
          K0=$?
          set -e
          echo "K0=$K0"
          cat v124_k0.log
          if [ "$K0" -eq 0 ]; then
            echo "NULL_K0_ALREADY_DIRECT_STRATA"
            exit 51
          fi
      - name: Apply exact frozen V120 K2
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          git diff -- Specimen/DeriveConstrainedProducer.lean | tee v124_k2.patch
          lake build Specimen.DeriveConstrainedProducer
      - name: K2 direct real-Strata target and sample verifier
        shell: bash
        run: |
          set +e
          lake env lean SpecimenTest/V124DirectStrataLExpr.lean > v124_k2.log 2>&1
          K2=$?
          set -e
          echo "K2=$K2"
          cat v124_k2.log
          if [ "$K2" -ne 0 ]; then
            echo "NULL_K2_DOES_NOT_RESOLVE_DIRECT_STRATA"
            exit 52
          fi
      - name: Ablate K2 and rerun direct target
        shell: bash
        run: |
          git checkout -- Specimen/DeriveConstrainedProducer.lean
          lake build Specimen.DeriveConstrainedProducer
          set +e
          lake env lean SpecimenTest/V124DirectStrataLExpr.lean > v124_ablate.log 2>&1
          ABLATE=$?
          set -e
          echo "ABLATE=$ABLATE"
          cat v124_ablate.log
          printf '{"k0":1,"k2":0,"ablate":%s}\n' "$ABLATE" > v124_result.json
          if [ "$ABLATE" -eq 0 ]; then
            echo "NULL_V124_ABLATION_NO_CAUSALITY"
            exit 53
          fi
          echo "PASS_V124_STRATA_DIRECT_KNOWN_WORLD"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v124-direct-strata-known-world
          path: |
            v124_k0.log
            v124_k2.log
            v124_ablate.log
            v124_k2.patch
            v124_result.json
