name: V131 dependent output-type discriminator

on:
  push:
    branches: ["v120-binder-aware-fixed-parameter"]
  workflow_dispatch:

jobs:
  discriminate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: "false"
          test: "false"

      - name: Apply exact K2 and diagnostic-only V131 instrumentation
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v131_instrument_dependent_output_type_roles.py
          lake build Specimen.DeriveConstrainedProducer

      - name: Prepare isolated fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('SpecimenTest/V126ComputedParameterBridgeDiscriminator.lean').read_text()
          common=src.split('/-- ID arm. -/',1)[0]
          Path('/tmp/V131MAP.lean').write_text(common + 'derive_mutual (fun (p : V126Base) (n : Nat) => ∃ b : V126BoxMap (V126Lift p), V126HasMap b n)\n')
          Path('/tmp/V131ID.lean').write_text(common + 'derive_mutual (fun (p : V126Base) (n : Nat) => ∃ b : V126BoxId p, V126HasId b n)\n')
          Path('/tmp/V131TERM.lean').write_text('''import Plausible.Arbitrary\nimport Specimen.ArbitrarySizedSuchThat\nimport Specimen.DeriveConstrainedProducer\n\ninductive V131Square : Nat → Nat → Prop where\n| sq : forall x, V131Square x (x * x)\n\nderive_generator (fun n => ∃ (m : Nat), V131Square m n)\n''')
          PY

      - name: Run V131 classifier
        shell: bash
        run: |
          set +e
          lake env lean /tmp/V131MAP.lean > v131_map.log 2>&1; MAP=$?
          lake env lean /tmp/V131ID.lean > v131_id.log 2>&1; ID=$?
          lake env lean /tmp/V131TERM.lean > v131_term.log 2>&1; TERM=$?
          set -e
          echo "MAP=$MAP ID=$ID TERM=$TERM"
          cat v131_map.log
          cat v131_id.log
          cat v131_term.log
          python - <<'PY'
          from pathlib import Path
          m=Path('v131_map.log').read_text()
          i=Path('v131_id.log').read_text()
          t=Path('v131_term.log').read_text()
          g1=('V126Lift' in m and 'output_dependent_type=true' in m)
          g2=('candidate=x * x' in t and 'output_dependent_type=false' in t)
          g3=('V126Lift' not in i)
          print('G1_MAP_OUTPUT_TYPE=', g1)
          print('G2_TERM_NOT_OUTPUT_TYPE=', g2)
          print('G3_ID_CONTROL=', g3)
          Path('v131_result.json').write_text('{"g1":%s,"g2":%s,"g3":%s}\n' % (str(g1).lower(),str(g2).lower(),str(g3).lower()))
          if not (g1 and g2 and g3):
              raise SystemExit(121)
          print('PASS_V131_DEPENDENT_OUTPUT_TYPE_DISCRIMINATOR')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v131-dependent-output-type-discriminator
          path: |
            v131_map.log
            v131_id.log
            v131_term.log
            v131_result.json
