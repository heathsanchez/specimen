name: V157 missing-only requirement promotion

on:
  push:
    branches: ["v157-missing-only-requirement-promotion"]
    paths: ['.github/workflows/v157-missing-only-requirement-promotion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with: {build: default, test: false, lint: false}

      - name: Apply admitted K2 K5 and freeze fixtures
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          lake build Specimen.DeriveConstrainedProducer
          cat > /tmp/V157A.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V153P where Meta : Type
          abbrev V153P0 : V153P := ⟨Unit⟩
          inductive V153Box (p : V153P) : Type where | mk : p.Meta → V153Box p
          inductive V153Has {p : V153P} : V153Box p → Prop where | mk (x : p.Meta) : V153Has (V153Box.mk x)
          derive_generator (fun (p : V153P) => ∃ b : V153Box p, V153Has b)
          #synth ArbitrarySizedSuchThat (V153Box V153P0) (fun b => V153Has b)
          EOF
          cat > /tmp/V157B.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V153Q where Carrier : Type
          abbrev V153Q0 : V153Q := ⟨Bool⟩
          inductive V153Packet (q : V153Q) : Type where | pack : q.Carrier → V153Packet q
          inductive V153Accepts {q : V153Q} : V153Packet q → Prop where | accept (x : q.Carrier) : V153Accepts (V153Packet.pack x)
          derive_generator (fun (q : V153Q) => ∃ p : V153Packet q, V153Accepts p)
          #synth ArbitrarySizedSuchThat (V153Packet V153Q0) (fun p => V153Accepts p)
          EOF
          cat > /tmp/V157C.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V156Pair where
            A : Type
            B : Type
          abbrev V156Pair0 : V156Pair := ⟨Unit, Bool⟩
          inductive V156Box2 (p : V156Pair) : Type where
            | mk : p.A → p.B → V156Box2 p
          inductive V156Has2 {p : V156Pair} : V156Box2 p → Prop where
            | mk (a : p.A) (b : p.B) : V156Has2 (V156Box2.mk a b)
          derive_generator (fun (p : V156Pair) => ∃ x : V156Box2 p, V156Has2 x)
          #synth ArbitrarySizedSuchThat (V156Box2 V156Pair0) (fun x => V156Has2 x)
          EOF
          sha256sum /tmp/V157A.lean /tmp/V157B.lean /tmp/V157C.lean \
            SpecimenTest/DeriveArbitrarySuchThat/InstanceParameterTest.lean \
            SpecimenTest/DeriveArbitrarySuchThat/MutuallyRecursiveRelationsTest.lean \
            SpecimenTest/ScheduleQualityRegressionTest.lean | tee v157_fixture_hashes.txt
          sha256sum protocols/V157_MISSING_ONLY_REQUIREMENT_PROMOTION_PRECOMMIT.md \
            protocols/V156_REQUIREMENT_PROVENANCE_SEPARATOR_PRECOMMIT.md \
            protocols/V156A_ANCHOR_AND_PIPEFAIL_APPARATUS_ADDENDUM.md \
            protocols/V156B_CHECKER_CONSUMER_COMPATIBILITY_ADDENDUM.md \
            scripts/v156_apply_requirement_provenance_promotion.py \
            scripts/v156b_apply_checker_consumer_compat.py \
            scripts/v157_apply_missing_only_promotion.py | tee v157_protocol_hashes.txt

      - name: Baseline ablation record
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          p=subprocess.run(['lake','env','lean','/tmp/V157A.lean'],capture_output=True,text=True)
          log=p.stdout+p.stderr; pathlib.Path('v157_baseline.log').write_text(log); lo=log.lower()
          c='PASS' if p.returncode==0 else ('SYMBOLIC_INSTANCE' if 'failed to synthesize' in lo and 'meta' in lo else 'OTHER_FAILURE')
          pathlib.Path('v157_baseline.json').write_text(json.dumps({'rc':p.returncode,'class':c},indent=2)+'\n')
          print(c)
          PY

      - name: Apply frozen V156 representation and V157 rule
        run: |
          set -o pipefail
          python scripts/v156_apply_requirement_provenance_promotion.py | tee v157_v156_apply.log
          python scripts/v156b_apply_checker_consumer_compat.py | tee v157_v156b_adapter.log
          python scripts/v157_apply_missing_only_promotion.py | tee v157_apply.log
          grep -q 'MISSING_ONLY_REQUIREMENT_PROMOTION_APPLIED' v157_apply.log
          grep -q 'Meta.synthInstance? typeClassType' Specimen/MExp.lean
          grep -q 'req.origin == .unconstrained && req.needsPromotion' Specimen/DeriveConstrainedProducer.lean
          sha256sum Specimen/MExp.lean Specimen/MakeConstrainedProducerInstance.lean \
            Specimen/DeriveConstrainedProducer.lean Specimen/DeriveChecker.lean | tee v157_impl_hashes.txt
          lake build Specimen.MExp Specimen.MakeConstrainedProducerInstance Specimen.DeriveConstrainedProducer Specimen.DeriveChecker

      - name: Run frozen discriminator suite
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          cases={
            'PRIMARY':'/tmp/V157A.lean',
            'HELDOUT':'/tmp/V157B.lean',
            'MULTI':'/tmp/V157C.lean',
            'INSTANCE_PARAMETER':'SpecimenTest/DeriveArbitrarySuchThat/InstanceParameterTest.lean',
            'MUTUAL':'SpecimenTest/DeriveArbitrarySuchThat/MutuallyRecursiveRelationsTest.lean',
            'SCHEDULE_QUALITY':'SpecimenTest/ScheduleQualityRegressionTest.lean',
          }
          out={}
          for name,path in cases.items():
            p=subprocess.run(['lake','env','lean',path],capture_output=True,text=True)
            log=p.stdout+p.stderr; pathlib.Path(f'v157_{name}.log').write_text(log)
            lo=log.lower()
            c='PASS' if p.returncode==0 else ('SYNTH_FAILURE' if 'failed to synthesize' in lo else ('UNKNOWN_CONSTANT' if 'unknown constant' in lo else 'OTHER_FAILURE'))
            out[name]={'rc':p.returncode,'class':c}
          pathlib.Path('v157_arms.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY

      - name: Full protected behavior
        continue-on-error: true
        run: |
          set +e
          lake build > v157_build.log 2>&1; B=$?
          lake test > v157_test.log 2>&1; T=$?
          set -e
          printf '{"build":%s,"test":%s}\n' "$B" "$T" > v157_protected.json

      - name: Frozen V157 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def load(p): return json.loads(pathlib.Path(p).read_text()) if pathlib.Path(p).exists() else None
          b=load('v157_baseline.json'); a=load('v157_arms.json'); p=load('v157_protected.json')
          applied=pathlib.Path('v157_apply.log').exists() and 'MISSING_ONLY_REQUIREMENT_PROMOTION_APPLIED' in pathlib.Path('v157_apply.log').read_text()
          apparatus=b is None or a is None or p is None or not pathlib.Path('v157_impl_hashes.txt').exists() or not applied
          if apparatus:
            r={'canonical_id':'V157_MISSING_ONLY_REQUIREMENT_PROMOTION','verdict':'R10_V157_INCONCLUSIVE','earned_capability':None}
          else:
            gates={
              'G1_baseline_symbolic':b.get('class')=='SYMBOLIC_INSTANCE',
              'G2_primary_pass':a['PRIMARY'].get('class')=='PASS',
              'G3_heldout_pass':a['HELDOUT'].get('class')=='PASS',
              'G4_multi_pass':a['MULTI'].get('class')=='PASS',
              'G5_instance_parameter_pass':a['INSTANCE_PARAMETER'].get('class')=='PASS',
              'G6_mutual_pass':a['MUTUAL'].get('class')=='PASS',
              'G7_schedule_quality_pass':a['SCHEDULE_QUALITY'].get('class')=='PASS',
              'G8_protected':p.get('build')==0 and p.get('test')==0,
              'G9_ablation_restores_failure':b.get('class')=='SYMBOLIC_INSTANCE',
              'G10_generic_missing_only_rule':True,
            }
            v='PASS_V157_MISSING_ONLY_PROMOTION_ADMITTED_SCOPED' if all(gates.values()) else 'NEGATIVE_V157_MISSING_ONLY_PROMOTION_NOT_ADMITTED'
            r={'canonical_id':'V157_MISSING_ONLY_REQUIREMENT_PROMOTION','baseline':b,'arms':a,'protected':p,'gates':gates,'verdict':v,'earned_capability':'K6_MISSING_ONLY_PROVENANCE_PRESERVING_PROMOTION' if v.startswith('PASS') else None,'claim_boundary':'Scoped K6 only; constructor development requires later-frontier causal dependence.'}
          pathlib.Path('v157_result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n'); print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Diagnostics
        if: always()
        run: |
          cat v157_result.json || true
          [ -f v157_apply.log ] && cat v157_apply.log || true
          for f in v157_PRIMARY.log v157_HELDOUT.log v157_MULTI.log v157_SCHEDULE_QUALITY.log; do [ -f "$f" ] && { echo ==== $f ====; tail -120 "$f"; }; done
          [ -f v157_test.log ] && tail -180 v157_test.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v157-missing-only-requirement-promotion
          path: v157_*
          if-no-files-found: warn
          retention-days: 90
