name: V169 K7S obsolete expectation maintenance
on:
  push:
    branches: ["v169-k7s-obsolete-expectation-maintenance"]
    paths: ['.github/workflows/v169-k7s-obsolete-expectation-maintenance.yml']
  workflow_dispatch:
permissions: {contents: read}

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with: {build: default, test: false, lint: false}

      - name: Freeze identities
        run: |
          set -euo pipefail
          sha256sum protocols/V169_K7S_OBSOLETE_EXPECTATION_MAINTENANCE.md \
            scripts/v168_apply_certified_constructor_irrefutability.py \
            scripts/v169_remove_obsolete_redundant_match_expectations.py \
            fixtures/V165_UPSTREAM_ISSUE12_REPRO.lean \
            fixtures/V166_HELDOUT_SINGLE_CTOR_INDUCTIVE.lean \
            fixtures/V166_MULTICTOR_WILDCARD_SAFETY.lean | tee v169_hashes.txt
          test "$(sha256sum scripts/v168_apply_certified_constructor_irrefutability.py | awk '{print $1}')" = "5dd4755a3c42fa347d72f4694a3131ec97622a9405c12a0050eee57023dce3a1"

      - name: Apply admitted prior stack and unchanged K7S
        run: |
          set -euo pipefail
          git checkout HEAD -- Specimen SpecimenTest
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          python scripts/v156_apply_requirement_provenance_promotion.py
          python scripts/v156b_apply_checker_consumer_compat.py
          python scripts/v158_apply_scope_dependent_promotion.py
          cp Specimen/MExp.lean /tmp/v169_pre_k7s_MExp.lean
          python scripts/v168_apply_certified_constructor_irrefutability.py | tee v169_k7s_apply.log
          grep -q K7S_CERTIFIED_CONSTRUCTOR_IRREFUTABILITY_APPLIED v169_k7s_apply.log
          diff -u /tmp/v169_pre_k7s_MExp.lean Specimen/MExp.lean > v169_k7s_only.diff || true
          test -s v169_k7s_only.diff

      - name: Apply scoped test maintenance
        run: |
          set -euo pipefail
          cp -r SpecimenTest /tmp/v169_specimentest_before
          python scripts/v169_remove_obsolete_redundant_match_expectations.py | tee v169_maintenance_apply.log
          grep -q V169_OBSOLETE_REDUNDANT_MATCH_EXPECTATIONS_REMOVED v169_maintenance_apply.log
          git diff -- SpecimenTest > v169_maintenance.diff
          test -s v169_maintenance.diff
          git diff --name-only -- SpecimenTest | sort > v169_maintenance_names.txt
          cat > v169_expected_names.txt <<'EOF'
          SpecimenTest/DeriveArbitrarySuchThat/FunctionCallsTest.lean
          SpecimenTest/DeriveArbitrarySuchThat/NEqGenerator.lean
          SpecimenTest/DeriveArbitrarySuchThat/Syntax.lean
          EOF
          diff -u v169_expected_names.txt v169_maintenance_names.txt
          if grep -E '^diff --git a/Specimen/' v169_maintenance.diff; then exit 92; fi

      - name: Full protected build and test
        run: |
          set +e
          rm -rf .lake/build
          lake build > v169_build.log 2>&1
          echo "$?" > v169_build.rc
          lake test > v169_test.log 2>&1
          echo "$?" > v169_test.rc
          set -e

      - name: Frozen frontier fixtures under K7S
        run: |
          set +e
          lake env lean fixtures/V165_UPSTREAM_ISSUE12_REPRO.lean > v169_natural.log 2>&1; echo "$?" > v169_natural.rc
          lake env lean fixtures/V166_HELDOUT_SINGLE_CTOR_INDUCTIVE.lean > v169_heldout.log 2>&1; echo "$?" > v169_heldout.rc
          lake env lean fixtures/V166_MULTICTOR_WILDCARD_SAFETY.lean > v169_safety.log 2>&1; echo "$?" > v169_safety.rc
          set -e

      - name: Frozen V169 classification
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def rc(name):
              p=pathlib.Path(name)
              return int(p.read_text().strip()) if p.exists() else None
          build=rc('v169_build.rc'); test=rc('v169_test.rc')
          nat=rc('v169_natural.rc'); hold=rc('v169_heldout.rc'); safe=rc('v169_safety.rc')
          names=pathlib.Path('v169_maintenance_names.txt').read_text().splitlines() if pathlib.Path('v169_maintenance_names.txt').exists() else []
          expected=[
            'SpecimenTest/DeriveArbitrarySuchThat/FunctionCallsTest.lean',
            'SpecimenTest/DeriveArbitrarySuchThat/NEqGenerator.lean',
            'SpecimenTest/DeriveArbitrarySuchThat/Syntax.lean',
          ]
          k7s_ok=pathlib.Path('v169_k7s_apply.log').exists() and 'K7S_CERTIFIED_CONSTRUCTOR_IRREFUTABILITY_APPLIED' in pathlib.Path('v169_k7s_apply.log').read_text(errors='replace')
          maintenance_ok=(names==expected)
          gates={'full_build':build==0,'full_test':test==0,'natural':nat==0,'heldout':hold==0,'safety':safe==0,'k7s_identity':k7s_ok,'maintenance_scope':maintenance_ok}
          verdict='PASS_V169_K7S_ADMITTED_BOUNDED_NATURAL_CONSTRUCTOR_DEVELOPMENT' if all(gates.values()) else 'FAIL_V169_K7S_NOT_ADMITTED'
          out={'canonical_id':'V169_K7S_OBSOLETE_EXPECTATION_MAINTENANCE','gates':gates,'rc':{'build':build,'test':test,'natural':nat,'heldout':hold,'safety':safe},'maintenance_names':names,'verdict':verdict}
          pathlib.Path('v169_result.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          if not all(gates.values()): raise SystemExit(1)
          PY

      - name: Diagnostics
        if: always()
        run: |
          cat v169_result.json || true
          cat v169_maintenance.diff || true
          tail -180 v169_test.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v169-k7s-final-admission, path: 'v169*', retention-days: 90}
