name: V134 fixed specialization instance discriminator

on:
  push:
    branches: ["v120-binder-aware-fixed-parameter"]
  workflow_dispatch:

jobs:
  discriminate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: "false"
          test: "false"

      - name: Apply exact admitted K2 K5
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          lake build Specimen.DeriveConstrainedProducer

      - name: Materialize matched generic and fixed arms
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('SpecimenTest/V134FixedSpecializationInstanceDiscriminator.lean').read_text()
          generic = src.replace('-- derive_mutual (fun (p : V134P) => ∃ b : V134Box p, V134Has b)',
                                'derive_mutual (fun (p : V134P) => ∃ b : V134Box p, V134Has b)')
          fixed = src.replace('-- derive_mutual (fun _ : Unit => ∃ b : V134Box V134P0, V134Has b)',
                              'derive_mutual (fun _ : Unit => ∃ b : V134Box V134P0, V134Has b)')
          Path('/tmp/V134Generic.lean').write_text(generic)
          Path('/tmp/V134Fixed.lean').write_text(fixed)
          PY

      - name: Run frozen discriminator
        shell: bash
        run: |
          set +e
          lake env lean /tmp/V134Generic.lean > v134_generic.log 2>&1
          GENERIC=$?
          lake env lean /tmp/V134Fixed.lean > v134_fixed.log 2>&1
          FIXED=$?
          set -e
          echo "GENERIC=$GENERIC FIXED=$FIXED"
          cat v134_generic.log
          cat v134_fixed.log
          python - <<'PY'
          import json,re
          from pathlib import Path
          g=Path('v134_generic.log').read_text()
          f=Path('v134_fixed.log').read_text()
          generic_param = ('Arbitrary' in g and ('Meta' in g or 'V134P' in g)) or ('failed to synthesize' in g)
          fixed_symbolic = ('Arbitrary' in f and re.search(r'(a_|unk_|\.Meta)', f) is not None)
          fixed_unrelated = ('Type mismatch' in f and 'sort `Type 1`' in f) or ('unknown module' in f) or ('unexpected token' in f)
          result={
            'generic_rc': int(Path('/tmp/never').exists()) if False else None,
            'generic_parameter_dependent_signal': generic_param,
            'fixed_symbolic_instance_signal': fixed_symbolic,
            'fixed_unrelated_failure': fixed_unrelated,
          }
          Path('v134_result.json').write_text(json.dumps(result,indent=2))
          print(result)
          if fixed_symbolic and not fixed_unrelated and generic_param:
              print('PASS_V134_SPECIALIZATION_INSTANCE_DISCRIMINATOR')
              raise SystemExit(0)
          if 'FIXED=0' in '' :
              pass
          PY
          if [ "$FIXED" -eq 0 ]; then
            echo "NULL_SPECIALIZATION_PROPAGATES_IN_MINIMAL_CASE"
            exit 121
          fi
          if grep -Eq 'Arbitrary .*(a_|unk_|\.Meta)|failed to synthesize.*Arbitrary' v134_fixed.log; then
            echo "PASS_V134_SPECIALIZATION_INSTANCE_DISCRIMINATOR"
            exit 0
          fi
          echo "INVALID_OR_DIFFERENT_V134_DISCRIMINATOR"
          exit 122

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v134-fixed-specialization-instance-discriminator
          path: |
            v134_generic.log
            v134_fixed.log
            v134_result.json
