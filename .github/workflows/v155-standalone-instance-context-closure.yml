name: V155 standalone instance context closure

on:
  push:
    branches: ["v155-standalone-instance-context-closure"]
    paths:
      - '.github/workflows/v155-standalone-instance-context-closure.yml'
      - 'experiments/V155_STANDALONE_INSTANCE_CONTEXT_CLOSURE_PREREG.md'
  workflow_dispatch:

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: "false"
          test: "false"
      - name: Apply exact admitted K2 K5 only
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          lake build Specimen.DeriveConstrainedProducer
      - name: Freeze T0-T4 arms
        run: |
          cat > /tmp/V155Common.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V155P where Meta : Type
          def V155P0 : V155P := ⟨Unit⟩
          abbrev V155PA : V155P := ⟨Unit⟩
          inductive V155Box (p : V155P) : Type where | mk : p.Meta → V155Box p
          inductive V155Has {p : V155P} : V155Box p → Prop where | mk (x : p.Meta) : V155Has (V155Box.mk x)
          EOF
          cp /tmp/V155Common.lean /tmp/V155T0.lean
          echo 'derive_generator (fun (p : V155P) => ∃ b : V155Box p, V155Has b)' >> /tmp/V155T0.lean
          cp /tmp/V155Common.lean /tmp/V155T1.lean
          echo 'derive_generator (fun (p : V155P) [inst : Plausible.Arbitrary p.Meta] => ∃ b : V155Box p, V155Has b)' >> /tmp/V155T1.lean
          cp /tmp/V155Common.lean /tmp/V155T2.lean
          cat >> /tmp/V155T2.lean <<'EOF'
          instance : Plausible.Arbitrary V155P0.Meta := by
            change Plausible.Arbitrary Unit
            infer_instance
          derive_generator (fun (p : V155P) [inst : Plausible.Arbitrary p.Meta] => ∃ b : V155Box p, V155Has b)
          #synth ArbitrarySizedSuchThat (V155Box V155P0) (fun b => V155Has b)
          EOF
          cp /tmp/V155Common.lean /tmp/V155T3.lean
          cat >> /tmp/V155T3.lean <<'EOF'
          derive_generator (fun (p : V155P) [inst : Plausible.Arbitrary p.Meta] => ∃ b : V155Box p, V155Has b)
          #synth ArbitrarySizedSuchThat (V155Box V155PA) (fun b => V155Has b)
          EOF
          cp /tmp/V155Common.lean /tmp/V155T4.lean
          cat >> /tmp/V155T4.lean <<'EOF'
          section
          variable (p : V155P) [inst : Plausible.Arbitrary p.Meta]
          include p inst
          derive_generator (fun (_ : Unit) => ∃ b : V155Box p, V155Has b)
          end
          EOF
      - name: Execute frozen T0-T4
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,re
          out={}
          for n in range(5):
            k=f'T{n}'
            p=subprocess.run(['lake','env','lean',f'/tmp/V155{k}.lean'],capture_output=True,text=True)
            log=p.stdout+p.stderr; pathlib.Path(f'v155_{k}.log').write_text(log); lo=log.lower()
            if p.returncode==0: c='PASS'
            elif 'unknown identifier' in lo or 'unexpected token' in lo or 'parser' in lo: c='APPARATUS_OR_SYNTAX'
            elif 'expected to be a variable' in lo: c='NON_FVAR_APPLICABILITY'
            elif 'failed to synthesize' in lo and ('meta' in lo or 'arbitrary' in lo): c='SYMBOLIC_INSTANCE'
            else: c='OTHER_FAILURE'
            binder_accepted=('inst' in log or n==0) and not ('unexpected token' in lo or 'parser' in lo)
            out[k]={'rc':p.returncode,'class':c,'binder_accepted':binder_accepted,'tail':log[-8000:]}
          pathlib.Path('v155_arms.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - name: Protected baseline suite
        run: |
          set +e; lake build > v155_build.log 2>&1; B=$?; lake test > v155_test.log 2>&1; T=$?; set -e
          printf '{"build":%s,"test":%s}\n' "$B" "$T" > v155_protected.json
          [ "$B" -eq 0 ] && [ "$T" -eq 0 ]
      - name: Frozen V155 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('v155_arms.json').read_text()) if pathlib.Path('v155_arms.json').exists() else None
          p=json.loads(pathlib.Path('v155_protected.json').read_text()) if pathlib.Path('v155_protected.json').exists() else None
          if a is None or p is None:
            r={'canonical_id':'V155_STANDALONE_INSTANCE_CONTEXT_CLOSURE','verdict':'R10_INCONCLUSIVE'}
          else:
            c=lambda n:a[f'T{n}']['class']; prot=p.get('build')==0 and p.get('test')==0
            t4='SECTION_CONTEXT_UNAVAILABLE' if c(4)=='APPARATUS_OR_SYNTAX' else c(4)
            if c(0)!='SYMBOLIC_INSTANCE' or not prot:
              v='R10_CONTROL_OR_PROTECTED_FAILURE'
            elif c(1)=='APPARATUS_OR_SYNTAX':
              v='R10_EXPLICIT_STANDALONE_BINDER_NOT_EXERCISED'
            elif c(1)=='PASS' and (c(2)=='PASS' or c(3)=='PASS'):
              v='REJECT_OPERATOR_OLD_STANDALONE_CLOSURE_SUFFICES'
            elif c(1)=='SYMBOLIC_INSTANCE' and a['T1'].get('binder_accepted'):
              v='PASS_V155_EXPLICIT_STANDALONE_RIVAL_KILLED'
            else:
              v='V155_MIXED_OLD_CLOSURE_RESULT'
            r={'canonical_id':'V155_STANDALONE_INSTANCE_CONTEXT_CLOSURE','arms':{k:x['class'] for k,x in a.items()},'section_arm':t4,'protected':p,'verdict':v,'claim_boundary':'Old-operator closure only. Missing additive derivation operator may be licensed only if V153 expressive closure remains the best surviving explanation.'}
          pathlib.Path('v155_result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n'); print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Diagnostics
        if: always()
        run: |
          cat v155_result.json || true
          for f in v155_T*.log; do echo ==== $f ====; cat "$f"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v155-standalone-instance-context-closure
          path: v155_*
