name: V162 upstream issue9 K6 causal
on:
  push:
    branches: ["v162-upstream-issue9-k6-causal"]
    paths: ['.github/workflows/v162-upstream-issue9-k6-causal.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  causal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with: {build: default, test: false, lint: false}
      - name: Freeze task and implementation identity
        run: |
          sha256sum protocols/V162_UPSTREAM_ISSUE9_K6_CAUSAL_PRECOMMIT.md reports/V161_UPSTREAM_ISSUE_SELECTION.md fixtures/V162_UPSTREAM_ISSUE9_REPRO.lean scripts/v120_apply_binder_aware_fixed_parameter.py scripts/v132_apply_output_dependent_input_determined.py scripts/v156_apply_requirement_provenance_promotion.py scripts/v156b_apply_checker_consumer_compat.py scripts/v158_apply_scope_dependent_promotion.py | tee v162_hashes.txt
          test "$(sha256sum scripts/v156_apply_requirement_provenance_promotion.py | awk '{print $1}')" = "17074519a184a741e74466aa81604e809a14478abc15568f845395c788664d5c"
          test "$(sha256sum scripts/v156b_apply_checker_consumer_compat.py | awk '{print $1}')" = "8f3f7869fd775a8b6390e9d1483faa6a5d63bb4f52722b85f8374f17d1befd78"
          test "$(sha256sum scripts/v158_apply_scope_dependent_promotion.py | awk '{print $1}')" = "d88527a37a480313ac01a4730832f10f7f7ca6273c338e0523eacddea3200826"
      - name: Arm A K2 K5
        run: |
          git checkout HEAD -- Specimen SpecimenTest
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          rm -rf .lake/build
          python - <<'PY'
          import subprocess,time,json,pathlib
          t=time.monotonic(); p=subprocess.run(['timeout','120s','lake','env','lean','fixtures/V162_UPSTREAM_ISSUE9_REPRO.lean'],capture_output=True,text=True); dt=time.monotonic()-t
          log=p.stdout+p.stderr; pathlib.Path('v162_A.log').write_text(log)
          cls='PASS' if p.returncode==0 else ('TIMEOUT' if p.returncode==124 else 'SEMANTIC_OR_ELAB_FAILURE')
          r={'rc':p.returncode,'class':cls,'wall_seconds':dt}; pathlib.Path('v162_A.json').write_text(json.dumps(r,indent=2)+'\n'); print(r)
          PY
      - name: Arm B K2 K5 plus admitted K6
        run: |
          set -o pipefail
          git checkout HEAD -- Specimen SpecimenTest
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          python scripts/v156_apply_requirement_provenance_promotion.py | tee v162_B_v156.log
          python scripts/v156b_apply_checker_consumer_compat.py | tee v162_B_v156b.log
          python scripts/v158_apply_scope_dependent_promotion.py | tee v162_B_v158.log
          grep -q REQUIREMENT_PROVENANCE_PROMOTION_APPLIED v162_B_v156.log
          grep -q V156B_CHECKER_CONSUMER_COMPAT_APPLIED v162_B_v156b.log
          grep -q SCOPE_DEPENDENT_REQUIREMENT_PROMOTION_APPLIED v162_B_v158.log
          rm -rf .lake/build
          python - <<'PY'
          import subprocess,time,json,pathlib
          t=time.monotonic(); p=subprocess.run(['timeout','120s','lake','env','lean','fixtures/V162_UPSTREAM_ISSUE9_REPRO.lean'],capture_output=True,text=True); dt=time.monotonic()-t
          log=p.stdout+p.stderr; pathlib.Path('v162_B.log').write_text(log)
          cls='PASS' if p.returncode==0 else ('TIMEOUT' if p.returncode==124 else 'SEMANTIC_OR_ELAB_FAILURE')
          r={'rc':p.returncode,'class':cls,'wall_seconds':dt}; pathlib.Path('v162_B.json').write_text(json.dumps(r,indent=2)+'\n'); print(r)
          PY
      - name: Arm B protected behavior
        continue-on-error: true
        run: |
          set +e
          lake build > v162_B_build.log 2>&1; BB=$?
          lake test > v162_B_test.log 2>&1; BT=$?
          set -e
          printf '{"build":%s,"test":%s}\n' "$BB" "$BT" > v162_B_protected.json
      - name: Arm C independent K6 ablation
        run: |
          git checkout HEAD -- Specimen SpecimenTest
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          rm -rf .lake/build
          python - <<'PY'
          import subprocess,time,json,pathlib
          t=time.monotonic(); p=subprocess.run(['timeout','120s','lake','env','lean','fixtures/V162_UPSTREAM_ISSUE9_REPRO.lean'],capture_output=True,text=True); dt=time.monotonic()-t
          log=p.stdout+p.stderr; pathlib.Path('v162_C.log').write_text(log)
          cls='PASS' if p.returncode==0 else ('TIMEOUT' if p.returncode==124 else 'SEMANTIC_OR_ELAB_FAILURE')
          r={'rc':p.returncode,'class':cls,'wall_seconds':dt}; pathlib.Path('v162_C.json').write_text(json.dumps(r,indent=2)+'\n'); print(r)
          PY
      - name: Frozen V162 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def load(p): return json.loads(pathlib.Path(p).read_text()) if pathlib.Path(p).exists() else None
          A=load('v162_A.json'); B=load('v162_B.json'); C=load('v162_C.json'); P=load('v162_B_protected.json')
          apparatus=any(x is None for x in [A,B,C,P]) or not pathlib.Path('v162_hashes.txt').exists()
          if apparatus: out={'verdict':'R10_V162_INCONCLUSIVE','constructor_development':False}
          else:
            protected=P.get('build')==0 and P.get('test')==0
            causal=(A['class']!='PASS' and B['class']=='PASS' and C['class']!='PASS' and protected)
            same=A['class']==B['class']==C['class']
            if causal: v='PASS_V162_K6_CAUSES_UPSTREAM_ISSUE9_REACHABILITY'
            elif same: v='NEGATIVE_V162_K6_NO_EFFECT_ON_ISSUE9'
            elif A['class']=='PASS' and B['class']=='PASS': v='NULL_V162_NO_REACHABILITY_MOVEMENT'
            else: v='INCONCLUSIVE_V162_MIXED_PATTERN'
            out={'canonical_id':'V162_UPSTREAM_ISSUE9_K6_CAUSAL','A':A,'B':B,'C':C,'B_protected':P,'protected_pass':protected,'verdict':v,'constructor_development':causal,'claim_boundary':'Issue #9 only; timing unreplicated; no recursive/open-ended claim.'}
          pathlib.Path('v162_result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Diagnostics
        if: always()
        run: |
          cat v162_result.json || true
          for f in v162_A.log v162_B.log v162_C.log; do [ -f "$f" ] && { echo ==== $f ====; tail -100 "$f"; }; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v162-upstream-issue9-k6-causal, path: 'v162_*', retention-days: 90}
