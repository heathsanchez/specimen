name: V151 dependent-premise rebinding separator

on:
  push:
    branches: ["v151-dependent-premise-rebinding-separator"]
    paths:
      - '.github/workflows/v151-dependent-premise-rebinding-separator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  separator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          build: default
          test: false
          lint: false

      - name: Freeze V151 provenance and fixtures before outcome
        run: |
          sha256sum protocols/V151_DEPENDENT_PREMISE_REBINDING_SEPARATOR_PRECOMMIT.md
          cat > /tmp/V151A_BASE.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          structure V151P where Meta : Type
          def V151P0 : V151P := ⟨Unit⟩
          inductive V151Box (p : V151P) : Type where | mk : p.Meta → V151Box p
          inductive V151Has {p : V151P} : V151Box p → Prop where | mk (x : p.Meta) : V151Has (V151Box.mk x)
          instance (p : V151P) : ArbitrarySizedSuchThat (V151Box p) (fun b => V151Has b) where
            arbitrarySizedST := fun _ => do
              let x : p.Meta ← Plausible.Arbitrary.arbitrary
              return V151Box.mk x
          EOF
          cat > /tmp/V151A_REBOUND.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          structure V151P where Meta : Type
          def V151P0 : V151P := ⟨Unit⟩
          inductive V151Box (p : V151P) : Type where | mk : p.Meta → V151Box p
          inductive V151Has {p : V151P} : V151Box p → Prop where | mk (x : p.Meta) : V151Has (V151Box.mk x)
          instance (p : V151P) [Plausible.Arbitrary p.Meta] : ArbitrarySizedSuchThat (V151Box p) (fun b => V151Has b) where
            arbitrarySizedST := fun _ => do
              let x : p.Meta ← Plausible.Arbitrary.arbitrary
              return V151Box.mk x
          #synth ArbitrarySizedSuchThat (V151Box V151P0) (fun b => V151Has b)
          EOF
          cat > /tmp/V151B_BASE.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          structure V151Q where Carrier : Type
          def V151Q0 : V151Q := ⟨Bool⟩
          inductive V151Packet (q : V151Q) : Type where | pack : q.Carrier → V151Packet q
          inductive V151Accepts {q : V151Q} : V151Packet q → Prop where | accept (x : q.Carrier) : V151Accepts (V151Packet.pack x)
          instance (q : V151Q) : ArbitrarySizedSuchThat (V151Packet q) (fun p => V151Accepts p) where
            arbitrarySizedST := fun _ => do
              let x : q.Carrier ← Plausible.Arbitrary.arbitrary
              return V151Packet.pack x
          EOF
          cat > /tmp/V151B_REBOUND.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          structure V151Q where Carrier : Type
          def V151Q0 : V151Q := ⟨Bool⟩
          inductive V151Packet (q : V151Q) : Type where | pack : q.Carrier → V151Packet q
          inductive V151Accepts {q : V151Q} : V151Packet q → Prop where | accept (x : q.Carrier) : V151Accepts (V151Packet.pack x)
          instance (q : V151Q) [Plausible.Arbitrary q.Carrier] : ArbitrarySizedSuchThat (V151Packet q) (fun p => V151Accepts p) where
            arbitrarySizedST := fun _ => do
              let x : q.Carrier ← Plausible.Arbitrary.arbitrary
              return V151Packet.pack x
          #synth ArbitrarySizedSuchThat (V151Packet V151Q0) (fun p => V151Accepts p)
          EOF
          sha256sum /tmp/V151*.lean | tee v151_fixture_hashes.txt

      - name: Run frozen V151 separator
        run: |
          python - <<'PY'
          import json, pathlib, subprocess
          files={
            'BASE_A':'/tmp/V151A_BASE.lean',
            'REBOUND_A':'/tmp/V151A_REBOUND.lean',
            'BASE_B':'/tmp/V151B_BASE.lean',
            'REBOUND_B':'/tmp/V151B_REBOUND.lean',
          }
          out={}
          for name,path in files.items():
            p=subprocess.run(['lake','env','lean',path],capture_output=True,text=True)
            log=p.stdout+p.stderr
            pathlib.Path(f'v151_{name}.log').write_text(log)
            lo=log.lower()
            out[name]={
              'rc':p.returncode,
              'missing_dependent_arbitrary': 'failed to synthesize' in lo and ('meta' in lo or 'carrier' in lo),
              'first_error': next((x for x in log.splitlines() if 'error' in x.lower()),''),
            }
          gates={
            'G1_base_A_missing':out['BASE_A']['rc']!=0 and out['BASE_A']['missing_dependent_arbitrary'],
            'G2_rebound_A_pass':out['REBOUND_A']['rc']==0,
            'G3_base_B_missing':out['BASE_B']['rc']!=0 and out['BASE_B']['missing_dependent_arbitrary'],
            'G4_rebound_B_pass':out['REBOUND_B']['rc']==0,
          }
          verdict='PASS_V151_REBINDING_RIVAL_CONFIRMED' if all(gates.values()) else 'NEGATIVE_V151_REBINDING_RIVAL_NOT_CONFIRMED'
          r={'canonical_id':'V151_DEPENDENT_PREMISE_REBINDING_SEPARATOR','arms':out,'gates':gates,'verdict':verdict,'claim_boundary':'Mechanism separator only; cannot earn K6.'}
          pathlib.Path('v151_result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Protected baseline sanity
        run: |
          lake build
          lake test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v151-dependent-premise-rebinding-separator
          path: v151_*
          if-no-files-found: warn
