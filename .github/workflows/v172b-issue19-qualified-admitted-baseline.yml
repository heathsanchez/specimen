name: V172B issue19 qualified admitted baseline
on:
  push:
    branches: ["v172b-issue19-qualified-admitted-baseline"]
    paths: ['.github/workflows/v172b-issue19-qualified-admitted-baseline.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with: {build: false, test: false, lint: false}
      - name: Freeze complete admitted baseline and unchanged intervention
        run: |
          set -euo pipefail
          lake --version
          sha256sum protocols/V172B_ISSUE19_QUALIFIED_ADMITTED_BASELINE.md \
            fixtures/V172_MAP_SHAPED_FIXED_PARAMS.lean fixtures/V172_SET_SHAPED_FIXED_PARAM.lean \
            fixtures/V171_GENERATED_TYPE_SAFETY.lean fixtures/V171_EQUALITY_TYPEPARAM_SAFETY.lean \
            scripts/v120_apply_binder_aware_fixed_parameter.py scripts/v132_apply_output_dependent_input_determined.py \
            scripts/v156_apply_requirement_provenance_promotion.py scripts/v156b_apply_checker_consumer_compat.py \
            scripts/v158_apply_scope_dependent_promotion.py scripts/v168_apply_certified_constructor_irrefutability.py \
            scripts/v169_remove_obsolete_redundant_match_expectations.py \
            scripts/v171_apply_delete_default_typeparam_constraints.py | tee v172b_hashes.txt
      - name: Define helpers
        run: |
          cat > /tmp/v172b.sh <<'SH'
          set -euo pipefail
          prior() {
            python scripts/v120_apply_binder_aware_fixed_parameter.py
            python scripts/v132_apply_output_dependent_input_determined.py
            python scripts/v156_apply_requirement_provenance_promotion.py
            python scripts/v156b_apply_checker_consumer_compat.py
            python scripts/v158_apply_scope_dependent_promotion.py
            python scripts/v168_apply_certified_constructor_irrefutability.py
            python scripts/v169_remove_obsolete_redundant_match_expectations.py
          }
          clean() { git checkout HEAD -- Specimen SpecimenTest; rm -rf .lake/build; }
          probe() { local f="$1" p="$2"; set +e; lake env lean "$f" > "$p.log" 2>&1; local r=$?; set -e; echo "$r" > "$p.rc"; }
          scope_audit() {
            local p="$1"
            git diff --name-only -- SpecimenTest | sort > "${p}_maintenance_names.txt"
            cat > "${p}_expected_names.txt" <<'EOF'
          SpecimenTest/DeriveArbitrarySuchThat/FunctionCallsTest.lean
          SpecimenTest/DeriveArbitrarySuchThat/NEqGenerator.lean
          SpecimenTest/DeriveArbitrarySuchThat/Syntax.lean
          EOF
            diff -u "${p}_expected_names.txt" "${p}_maintenance_names.txt"
          }
          SH
      - name: Arm A complete admitted baseline
        run: |
          source /tmp/v172b.sh
          clean; prior > v172b_A_apply.log 2>&1; scope_audit v172b_A
          set +e
          lake build > v172b_A_fullbuild.log 2>&1; echo $? > v172b_A_fullbuild.rc
          lake test > v172b_A_test.log 2>&1; echo $? > v172b_A_test.rc
          set -e
          probe fixtures/V172_MAP_SHAPED_FIXED_PARAMS.lean v172b_A_map
          probe fixtures/V172_SET_SHAPED_FIXED_PARAM.lean v172b_A_set
      - name: Arm B unchanged deletion on complete admitted baseline
        run: |
          source /tmp/v172b.sh
          clean; prior > v172b_B_prior.log 2>&1; scope_audit v172b_B
          python scripts/v171_apply_delete_default_typeparam_constraints.py | tee v172b_B_delete.log
          grep -q V171_DEFAULT_TYPEPARAM_CONSTRAINTS_DELETED_ALL_EMITTERS v172b_B_delete.log
          set +e
          lake build > v172b_B_fullbuild.log 2>&1; echo $? > v172b_B_fullbuild.rc
          lake test > v172b_B_test.log 2>&1; echo $? > v172b_B_test.rc
          set -e
          probe fixtures/V172_MAP_SHAPED_FIXED_PARAMS.lean v172b_B_map
          probe fixtures/V172_SET_SHAPED_FIXED_PARAM.lean v172b_B_set
          probe fixtures/V171_GENERATED_TYPE_SAFETY.lean v172b_B_generated
          probe fixtures/V171_EQUALITY_TYPEPARAM_SAFETY.lean v172b_B_equality
      - name: Arm C independent ablation
        run: |
          source /tmp/v172b.sh
          clean; prior > v172b_C_apply.log 2>&1; scope_audit v172b_C
          lake build Plausible Specimen > v172b_C_build.log 2>&1
          probe fixtures/V172_MAP_SHAPED_FIXED_PARAMS.lean v172b_C_map
          probe fixtures/V172_SET_SHAPED_FIXED_PARAM.lean v172b_C_set
      - name: Frozen V172B classification
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def arm(p):
            rp=pathlib.Path(p+'.rc'); lp=pathlib.Path(p+'.log')
            rc=int(rp.read_text().strip()) if rp.exists() else None
            log=lp.read_text(errors='replace') if lp.exists() else ''
            return {'rc':rc,'failed_synth':'failed to synthesize' in log.lower(),'tail':log[-1600:]}
          def rcfile(p):
            q=pathlib.Path(p); return int(q.read_text().strip()) if q.exists() else None
          A={'map':arm('v172b_A_map'),'set':arm('v172b_A_set')}
          B={'map':arm('v172b_B_map'),'set':arm('v172b_B_set'),'generated':arm('v172b_B_generated'),'equality':arm('v172b_B_equality')}
          C={'map':arm('v172b_C_map'),'set':arm('v172b_C_set')}
          vals={'A_build':rcfile('v172b_A_fullbuild.rc'),'A_test':rcfile('v172b_A_test.rc'),'B_build':rcfile('v172b_B_fullbuild.rc'),'B_test':rcfile('v172b_B_test.rc')}
          expected=['SpecimenTest/DeriveArbitrarySuchThat/FunctionCallsTest.lean','SpecimenTest/DeriveArbitrarySuchThat/NEqGenerator.lean','SpecimenTest/DeriveArbitrarySuchThat/Syntax.lean']
          scopes={x:(pathlib.Path(f'v172b_{x}_maintenance_names.txt').read_text().splitlines() if pathlib.Path(f'v172b_{x}_maintenance_names.txt').exists() else []) for x in ['A','B','C']}
          required=['v172b_A_fullbuild.rc','v172b_A_test.rc','v172b_B_fullbuild.rc','v172b_B_test.rc','v172b_B_delete.log','v172b_C_build.log']
          apparatus=not all(pathlib.Path(x).exists() for x in required)
          gates={
            'baseline_maintenance_scope':all(scopes[x]==expected for x in ['A','B','C']),
            'A_full_build':vals['A_build']==0,'A_full_test':vals['A_test']==0,
            'A_map_specific_failure':A['map']['rc'] not in (None,0) and A['map']['failed_synth'],
            'A_set_specific_failure':A['set']['rc'] not in (None,0) and A['set']['failed_synth'],
            'B_full_build':vals['B_build']==0,'B_full_test':vals['B_test']==0,
            'B_map_transfer':B['map']['rc']==0,'B_set_transfer':B['set']['rc']==0,
            'B_generated_safety':B['generated']['rc']==0,'B_equality_safety':B['equality']['rc']==0,
            'C_map_restores':C['map']['rc'] not in (None,0) and C['map']['failed_synth'],
            'C_set_restores':C['set']['rc'] not in (None,0) and C['set']['failed_synth'],
          }
          if apparatus: verdict='R10_V172B_INCONCLUSIVE'
          elif all(gates.values()): verdict='PASS_V172B_REQUIREMENT_DRIVEN_TYPEPARAM_BINDERS_ADMISSIBLE'
          elif vals['B_test'] != 0 or vals['B_build'] != 0: verdict='KILL_V172B_PROTECTED_REGRESSION'
          else: verdict='NEGATIVE_V172B_NOT_ADMITTED'
          out={'canonical_id':'V172B_ISSUE19_QUALIFIED_ADMITTED_BASELINE','apparatus':apparatus,'gates':gates,'rc':vals,'A':A,'B':B,'C':C,'scopes':scopes,'verdict':verdict}
          pathlib.Path('v172b_result.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - name: Diagnostics
        if: always()
        run: |
          cat v172b_result.json || true
          tail -100 v172b_A_test.log 2>/dev/null || true
          tail -100 v172b_B_test.log 2>/dev/null || true
          for f in v172b_*_map.log v172b_*_set.log v172b_B_generated.log v172b_B_equality.log; do echo ===$f===; tail -50 "$f" 2>/dev/null || true; done
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: v172b-issue19-qualified-admitted-baseline, path: 'v172b*', retention-days: 90}
