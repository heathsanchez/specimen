name: V146 instance-demand zeta access

on:
  push:
    branches: ["v145-k6-fixed-input-let-execution"]
    paths:
      - 'scripts/v146_apply_instance_demand_zeta_access.py'
      - '.github/workflows/v146-instance-demand-zeta-access.yml'
  workflow_dispatch:

jobs:
  v146:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: "false"
          test: "false"

      - name: Freeze V146 fixtures
        run: |
          cat > /tmp/V146Common.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer

          structure V146P where
            Meta : Type
          def V146P0 : V146P := ⟨Unit⟩
          inductive V146Box (p : V146P) : Type where
          | mk : p.Meta → V146Box p
          inductive V146Has {p : V146P} : V146Box p → Prop where
          | mk (x : p.Meta) : V146Has (V146Box.mk x)
          EOF
          cp /tmp/V146Common.lean /tmp/V146Direct.lean
          cat >> /tmp/V146Direct.lean <<'EOF'
          derive_mutual (fun (_ : Unit) => ∃ b : V146Box V146P0, V146Has b)
          #synth ArbitrarySizedSuchThat (V146Box V146P0) (fun b => V146Has b)
          EOF
          cp /tmp/V146Common.lean /tmp/V146Generic.lean
          cat >> /tmp/V146Generic.lean <<'EOF'
          derive_mutual (fun (p : V146P) (_ : Unit) => ∃ b : V146Box p, V146Has b)
          EOF

      - name: Execute frozen V146 separator
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import json, pathlib, subprocess

          def run(cmd, log, timeout=3600):
              p = subprocess.run(cmd, text=True, capture_output=True, timeout=timeout)
              out = p.stdout + p.stderr
              pathlib.Path(log).write_text(out)
              return p.returncode, out

          def cls(rc, log):
              low = log.lower()
              if rc == 0: return 'PASS'
              if 'expected to be a variable' in low: return 'NON_FVAR_APPLICABILITY'
              if 'failed to synthesize' in low and 'arbitrary' in low and 'meta' in low:
                  return 'SYMBOLIC_INSTANCE'
              return 'OTHER_FAILURE'

          out = {'canonical_id':'V146_INSTANCE_DEMAND_ZETA_ACCESS',
                 'protocol':'research/V146_INSTANCE_DEMAND_ZETA_ACCESS_PRECOMMIT.md'}

          # Common state: exact K2+K5+V145 fixed-input-let.
          for name, cmd in [
              ('k2',['python','scripts/v120_apply_binder_aware_fixed_parameter.py']),
              ('k5',['python','scripts/v132_apply_output_dependent_input_determined.py']),
              ('v145',['python','scripts/v145_apply_fixed_input_let.py'])]:
              rc, _ = run(cmd, f'v146_common_{name}.log')
              out[f'{name}_apply_rc'] = rc

          mrc, mlog = run(['lake','build','Specimen.DeriveConstrainedProducer'], 'v146_B_module.log')
          brc, blog = run(['lake','env','lean','/tmp/V146Direct.lean'], 'v146_B_direct.log') if mrc == 0 else (99, mlog)
          if mrc != 0: pathlib.Path('v146_B_direct.log').write_text(blog)
          bclass = cls(brc, blog)
          out['B'] = {'module_rc':mrc,'rc':brc,'class':bclass}

          # N: add only instance-demand normalization.
          napply, napplog = run(['python','scripts/v146_apply_instance_demand_zeta_access.py'], 'v146_N_apply.log')
          patch = subprocess.run(['git','diff','--','Specimen/MExp.lean'], text=True, capture_output=True).stdout
          pathlib.Path('v146_patch.diff').write_text(patch)
          forbidden = [x for x in ['V146P0','V146Box','V146Has','V145P0','Strata'] if x in patch]
          nmrc, nmlog = run(['lake','build','Specimen.MExp','Specimen.DeriveConstrainedProducer'], 'v146_N_module.log') if napply == 0 else (99, napplog)
          if nmrc == 0:
              nrc, nlog = run(['lake','env','lean','/tmp/V146Direct.lean'], 'v146_N_direct.log')
              grc, glog = run(['lake','env','lean','/tmp/V146Generic.lean'], 'v146_G_generic.log')
          else:
              nrc, nlog = 99, nmlog; grc, glog = 99, nmlog
              pathlib.Path('v146_N_direct.log').write_text(nlog)
              pathlib.Path('v146_G_generic.log').write_text(glog)
          nclass, gclass = cls(nrc,nlog), cls(grc,glog)
          out['N'] = {'apply_rc':napply,'module_rc':nmrc,'rc':nrc,'class':nclass,'forbidden_patch_tokens':forbidden}
          out['G'] = {'rc':grc,'class':gclass}

          if nmrc == 0:
              pbrc, _ = run(['lake','build'], 'v146_N_full_build.log')
              ptrc, _ = run(['lake','test'], 'v146_N_full_test.log') if pbrc == 0 else (99,'skipped')
              if pbrc != 0: pathlib.Path('v146_N_full_test.log').write_text('skipped after build failure\n')
          else:
              pbrc = ptrc = 99
              pathlib.Path('v146_N_full_build.log').write_text('skipped: N module failed\n')
              pathlib.Path('v146_N_full_test.log').write_text('skipped: N module failed\n')
          out['protected']={'build_rc':pbrc,'test_rc':ptrc}

          # A: remove only N, retain K2+K5+V145 source state.
          run(['git','checkout','--','Specimen/MExp.lean'], 'v146_A_restore_demand_normalization.log')
          amrc, amlog = run(['lake','build','Specimen.MExp','Specimen.DeriveConstrainedProducer'], 'v146_A_module.log')
          arc, alog = run(['lake','env','lean','/tmp/V146Direct.lean'], 'v146_A_direct.log') if amrc == 0 else (99,amlog)
          if amrc != 0: pathlib.Path('v146_A_direct.log').write_text(alog)
          aclass=cls(arc,alog)
          out['A']={'module_rc':amrc,'rc':arc,'class':aclass}

          gates={
              'G1_B_reproduces_v145_instance_residual': mrc==0 and bclass=='SYMBOLIC_INSTANCE' and 'fixedinput' in blog.lower(),
              'G2_N_progresses_beyond_fixedinput_instance': nmrc==0 and not (nclass=='SYMBOLIC_INSTANCE' and 'fixedinput' in nlog.lower()),
              'G3_A_restores_B': amrc==0 and aclass=='SYMBOLIC_INSTANCE' and 'fixedinput' in alog.lower(),
              'G4_symbolic_control_remains_missing': nmrc==0 and gclass=='SYMBOLIC_INSTANCE' and 'p_' in glog.lower(),
              'G5_protected_pass': pbrc==0 and ptrc==0,
              'G6_source_generic_boundary_patch': not forbidden,
          }
          out['gates']=gates
          if napply != 0 or nmrc != 0:
              verdict='R10_V146_SEPARATOR_IMPLEMENTATION'
          elif all(gates.values()) and nclass=='PASS':
              verdict='PASS_V146_R_ACCESS_FULL_CLOSURE'
          elif all(gates.values()):
              verdict='PASS_V146_R_ACCESS_MOVED_FURTHER'
          elif nmrc==0 and nclass=='SYMBOLIC_INSTANCE' and 'fixedinput' in nlog.lower():
              verdict='PASS_V146_R_ERASURE_AT_OR_BEFORE_INSTANCE_DEMAND'
          elif not gates['G5_protected_pass']:
              verdict='INVALID_V146_PROTECTED_REGRESSION'
          else:
              verdict='RESIDUAL_V146_OTHER'
          out['verdict']=verdict
          out['claim_boundary']='V146 decides access vs erasure at the instance-demand boundary only; it does not admit K6 or establish constructor development.'
          pathlib.Path('v146_result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Show V146 result
        if: always()
        run: |
          cat v146_result.json || true
          echo '--- N direct ---'; cat v146_N_direct.log || true
          echo '--- N module ---'; cat v146_N_module.log || true
          echo '--- G symbolic ---'; cat v146_G_generic.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v146-instance-demand-zeta-access
          path: |
            v146_result.json
            v146_*.log
            v146_patch.diff
          if-no-files-found: warn
