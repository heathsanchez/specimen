name: V163 V160 apparatus repair

on:
  push:
    branches: ["v163-v160-apparatus-repair"]
    paths:
      - '.github/workflows/v163-v160-apparatus-repair.yml'
      - 'experiments/V163_V160_APPARATUS_REPAIR_PREREG.md'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: "false"
          test: "false"
      - name: Apply K2 K5 and exact V156
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          python scripts/v156_apply_requirement_aware_deriver.py
          lake build Specimen.MakeConstrainedProducerInstance Specimen.DeriveConstrainedProducer
      - name: Freeze repaired L1 L2 D1 fixtures
        run: |
          cat > /tmp/V163L1.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V163P1 where
            A : Type
          inductive V163Box1 (p : V163P1) where | mk : p.A → V163Box1 p
          inductive V163Has1 (p : V163P1) : V163Box1 p → Prop where | mk (a : p.A) : V163Has1 p (.mk a)
          derive_generator_with_requirements (fun (p : V163P1) => ∃ b : V163Box1 p, V163Has1 p b)
          EOF
          cat > /tmp/V163L2.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V163P2 where
            A : Type
            B : Type
          inductive V163Box2 (p : V163P2) where | mk : p.A → p.B → V163Box2 p
          inductive V163Has2 (p : V163P2) : V163Box2 p → Prop where | mk (a : p.A) (b : p.B) : V163Has2 p (.mk a b)
          derive_generator_with_requirements (fun (p : V163P2) => ∃ b : V163Box2 p, V163Has2 p b)
          EOF
          cat > /tmp/V163D1.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V163PD where
            A : Type
          inductive V163Need : Nat → Prop where | zero : V163Need 0
          inductive V163BoxD (p : V163PD) where | mk : p.A → Nat → V163BoxD p
          inductive V163HasD (p : V163PD) : V163BoxD p → Prop where
            | mk (a : p.A) (n : Nat) : V163Need n → V163HasD p (.mk a n)
          derive_generator_with_requirements (fun (p : V163PD) => ∃ b : V163BoxD p, V163HasD p b)
          EOF
      - name: Execute repaired decomposition
        run: |
          python - <<'PY'
          import json,pathlib,re,subprocess
          out={}
          for name in ['L1','L2','D1']:
            p=subprocess.run(['lake','env','lean',f'/tmp/V163{name}.lean'],capture_output=True,text=True)
            log=p.stdout+p.stderr; pathlib.Path(f'v163_{name}.log').write_text(log); lo=log.lower()
            m=re.search(r'discovered\s+(\d+)',lo)
            if p.returncode==0:c='PASS'
            elif 'requirement-aware deriver currently supports' in lo:c='ARITY_FAILURE'
            elif 'failed to synthesize' in lo:c='SYNTH_FAILURE'
            elif 'unable to derive producer schedule' in lo or 'cannot derive constrained producer' in lo:c='SCHEDULE_FAILURE'
            else:c='OTHER_FAILURE'
            out[name]={'rc':p.returncode,'class':c,'discovered_count':None if m is None else int(m.group(1)),'tail':log[-12000:]}
          pathlib.Path('v163_arms.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY
      - name: Protected suite
        continue-on-error: true
        run: |
          set +e; lake build > v163_build.log 2>&1; B=$?; lake test > v163_test.log 2>&1; T=$?; set -e
          printf '{"build":%s,"test":%s}\n' "$B" "$T" > v163_protected.json
          exit 0
      - name: Frozen V163 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def load(p): return json.loads(pathlib.Path(p).read_text()) if pathlib.Path(p).exists() else None
          a=load('v163_arms.json'); p=load('v163_protected.json')
          if a is None or p is None:v='R10_INCONCLUSIVE'
          elif p.get('build')!=0 or p.get('test')!=0:v='R10_PROTECTED_FAILURE'
          else:
            l1=a['L1']; l2=a['L2']; d1=a['D1']
            if l1['class']=='PASS' and l2['class']=='ARITY_FAILURE' and l2['discovered_count']==2 and d1['class']=='ARITY_FAILURE' and d1['discovered_count']==2:
              v='PASS_V163_PURE_TWO_LEAF_MULTIPLICITY_CONFIRMED'
            elif l1['class']=='PASS':v='V163_PURE_TWO_LEAF_PATTERN_DIFFERS'
            else:v='R10_CONTROL_FAILURE'
          r={'canonical_id':'V163_V160_APPARATUS_REPAIR','arms':a,'protected':p,'verdict':v,'claim_boundary':'Apparatus repair only; PASS satisfies V162 execution precondition but admits no new operator.'}
          pathlib.Path('v163_result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n'); print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Diagnostics
        if: always()
        run: |
          cat v163_result.json || true
          for f in v163_L1.log v163_L2.log v163_D1.log; do [ -f "$f" ] && { echo ==== $f ====; cat "$f"; }; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v163-v160-apparatus-repair
          path: v163_*
