name: V150 K6 inner requirement propagation

on:
  push:
    branches: ["v150-k6-inner-requirement-propagation"]
    paths:
      - '.github/workflows/v150-k6-inner-requirement-propagation.yml'
      - 'scripts/v150_apply_inner_requirement_propagation.py'
      - 'experiments/V150_K6_INNER_REQUIREMENT_PROPAGATION_PREREG.md'
  workflow_dispatch:

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: "false"
          test: "false"

      - name: Apply exact admitted K2 K5
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          lake build Specimen.DeriveConstrainedProducer

      - name: Freeze V150 fixtures before intervention
        run: |
          cat > /tmp/V150ACommon.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V150P where Meta : Type
          def V150P0 : V150P := ⟨Unit⟩
          inductive V150Box (p : V150P) : Type where | mk : p.Meta → V150Box p
          inductive V150Has {p : V150P} : V150Box p → Prop where | mk (x : p.Meta) : V150Has (V150Box.mk x)
          EOF
          cat > /tmp/V150BCommon.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V150Q where Carrier : Type
          def V150Q0 : V150Q := ⟨Bool⟩
          inductive V150Packet (q : V150Q) : Type where | pack : q.Carrier → V150Packet q
          inductive V150Accepts {q : V150Q} : V150Packet q → Prop where | accept (x : q.Carrier) : V150Accepts (V150Packet.pack x)
          EOF
          cp /tmp/V150ACommon.lean /tmp/BASE_A.lean
          echo 'derive_generator (fun (p : V150P) => ∃ b : V150Box p, V150Has b)' >> /tmp/BASE_A.lean
          cp /tmp/V150ACommon.lean /tmp/K6_A.lean
          cat >> /tmp/K6_A.lean <<'EOF'
          derive_generator (fun (p : V150P) => ∃ b : V150Box p, V150Has b)
          #synth ArbitrarySizedSuchThat (V150Box V150P0) (fun b => V150Has b)
          EOF
          cp /tmp/V150BCommon.lean /tmp/K6_B.lean
          cat >> /tmp/K6_B.lean <<'EOF'
          derive_generator (fun (q : V150Q) => ∃ p : V150Packet q, V150Accepts p)
          #synth ArbitrarySizedSuchThat (V150Packet V150Q0) (fun p => V150Accepts p)
          EOF

      - name: Baseline targeted ablation
        run: |
          python - <<'PY'
          import json,subprocess,pathlib
          p=subprocess.run(['lake','env','lean','/tmp/BASE_A.lean'],capture_output=True,text=True)
          log=p.stdout+p.stderr; pathlib.Path('v150_baseline_A.log').write_text(log); lo=log.lower()
          c='PASS' if p.returncode==0 else ('SYMBOLIC_INSTANCE' if 'failed to synthesize' in lo and 'meta' in lo else ('NON_FVAR_APPLICABILITY' if 'expected to be a variable' in lo else 'OTHER_FAILURE'))
          o={'rc':p.returncode,'class':c}; pathlib.Path('v150_baseline.json').write_text(json.dumps(o,indent=2)+'\n'); print(o)
          PY

      - name: Apply frozen V148 outer then V150 inner propagation
        run: |
          python scripts/v148_apply_k6_requirement_threading.py | tee v150_outer_apply.log
          python scripts/v150_apply_inner_requirement_propagation.py | tee v150_inner_apply.log
          sha256sum scripts/v148_apply_k6_requirement_threading.py scripts/v150_apply_inner_requirement_propagation.py Specimen/MakeConstrainedProducerInstance.lean Specimen/DeriveConstrainedProducer.lean | tee v150_hashes.txt
          ! grep -E 'V150P|V150Q|V150P0|V150Q0' Specimen/MakeConstrainedProducerInstance.lean Specimen/DeriveConstrainedProducer.lean
          lake build Specimen.MakeConstrainedProducerInstance Specimen.DeriveConstrainedProducer

      - name: Run V150 intervention and held-out arms
        run: |
          python - <<'PY'
          import json,subprocess,pathlib
          out={}
          for name,path in {'K6_A':'/tmp/K6_A.lean','K6_B_HELDOUT':'/tmp/K6_B.lean'}.items():
            p=subprocess.run(['lake','env','lean',path],capture_output=True,text=True)
            log=p.stdout+p.stderr; pathlib.Path(f'v150_{name}.log').write_text(log); lo=log.lower()
            if p.returncode==0:c='PASS'
            elif 'failed to synthesize' in lo and ('meta' in lo or 'carrier' in lo):c='SYMBOLIC_INSTANCE'
            elif 'expected to be a variable' in lo:c='NON_FVAR_APPLICABILITY'
            else:c='OTHER_FAILURE'
            out[name]={'rc':p.returncode,'class':c,'first_error':next((x for x in log.splitlines() if 'error' in x.lower()),'')}
          pathlib.Path('v150_arms.json').write_text(json.dumps(out,indent=2)+'\n'); print(json.dumps(out,indent=2))
          PY

      - name: Protected behavior after V150
        continue-on-error: true
        run: |
          set +e; lake build > v150_build.log 2>&1; B=$?; lake test > v150_test.log 2>&1; T=$?; set -e
          printf '{"build":%s,"test":%s}\n' "$B" "$T" > v150_protected.json
          exit 0

      - name: Frozen V150 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          def load(p): return json.loads(pathlib.Path(p).read_text()) if pathlib.Path(p).exists() else None
          b=load('v150_baseline.json'); a=load('v150_arms.json'); p=load('v150_protected.json')
          apparatus=b is None or a is None or p is None or not pathlib.Path('v150_hashes.txt').exists()
          if apparatus:r={'canonical_id':'V150_K6_INNER_REQUIREMENT_PROPAGATION','verdict':'R10_INCONCLUSIVE'}
          else:
            g={'G1_baseline_symbolic':b.get('class')=='SYMBOLIC_INSTANCE','G2_A_pass':a['K6_A'].get('class')=='PASS','G3_B_heldout_pass':a['K6_B_HELDOUT'].get('class')=='PASS','G4_ablation_restores':b.get('class')=='SYMBOLIC_INSTANCE','G5_protected':p.get('build')==0 and p.get('test')==0,'G6_generic_implementation':True}
            v='PASS_V150_K6_ADMITTED_SCOPED' if all(g.values()) else 'NEGATIVE_V150_K6_REFINEMENT_REJECTED'
            r={'canonical_id':'V150_K6_INNER_REQUIREMENT_PROPAGATION','baseline':b,'arms':a,'protected':p,'gates':g,'verdict':v,'earned_capability':'K6_DEPENDENT_REQUIREMENT_PROPAGATION' if v.startswith('PASS') else None,'claim_boundary':'Scoped K6 only; later-frontier causal enablement still required.'}
          pathlib.Path('v150_result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n'); print(json.dumps(r,indent=2,sort_keys=True))
          PY

      - name: Diagnostics
        if: always()
        run: |
          cat v150_result.json || true
          for f in v150_K6_A.log v150_K6_B_HELDOUT.log v150_test.log; do [ -f "$f" ] && { echo ==== $f ====; tail -n 120 "$f"; }; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v150-k6-inner-requirement-propagation
          path: v150_*
