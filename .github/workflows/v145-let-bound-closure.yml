name: V145 let-bound old-closure separator

on:
  push:
    branches: ["v145-let-bound-closure"]
  workflow_dispatch:

jobs:
  separator:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: leanprover/lean-action@v1
        with:
          lint: false
          test: false
      - name: Apply exact admitted K2 K5
        run: |
          python scripts/v120_apply_binder_aware_fixed_parameter.py
          python scripts/v132_apply_output_dependent_input_determined.py
          lake build Specimen.DeriveConstrainedProducer
      - name: Materialize frozen arms
        run: |
          cat > /tmp/V145Common.lean <<'EOF'
          import Plausible.Arbitrary
          import Specimen.ArbitrarySizedSuchThat
          import Specimen.DeriveConstrainedProducer
          structure V145P where Meta : Type
          def V145P0 : V145P := ⟨Unit⟩
          inductive V145Box (p : V145P) : Type where | mk : p.Meta → V145Box p
          inductive V145Has {p : V145P} : V145Box p → Prop where | mk (x : p.Meta) : V145Has (V145Box.mk x)
          EOF
          cp /tmp/V145Common.lean /tmp/B.lean; cat >> /tmp/B.lean <<'EOF'
          derive_mutual (fun (_ : Unit) => ∃ b : V145Box V145P0, V145Has b)
          EOF
          cp /tmp/V145Common.lean /tmp/L.lean; cat >> /tmp/L.lean <<'EOF'
          derive_mutual (let p := V145P0; fun (_ : Unit) => ∃ b : V145Box p, V145Has b)
          EOF
          cp /tmp/V145Common.lean /tmp/LS.lean; cat >> /tmp/LS.lean <<'EOF'
          derive_mutual (let p := V145P0; fun (_ : Unit) => ∃ b : V145Box p, V145Has b)
          #synth ArbitrarySizedSuchThat (V145Box V145P0) (fun b => V145Has b)
          EOF
          cp /tmp/V145Common.lean /tmp/G.lean; cat >> /tmp/G.lean <<'EOF'
          derive_mutual (fun (p : V145P) (_ : Unit) => ∃ b : V145Box p, V145Has b)
          EOF
      - name: Run frozen arms
        run: |
          python - <<'PY'
          import subprocess,json,pathlib
          out={}
          for n in ['B','L','LS','G']:
              p=subprocess.run(['lake','env','lean',f'/tmp/{n}.lean'],capture_output=True,text=True)
              log=p.stdout+p.stderr; pathlib.Path(f'v145_{n}.log').write_text(log); lo=log.lower()
              if p.returncode==0: c='PASS'
              elif 'expected to be a variable' in lo: c='NON_FVAR_APPLICABILITY'
              elif 'failed to synthesize' in lo and 'arbitrary' in lo and 'meta' in lo: c='SYMBOLIC_INSTANCE'
              elif 'unexpected token' in lo or 'parser' in lo or 'invalid term' in lo: c='R10_APPARATUS'
              else: c='OTHER_FAILURE'
              out[n]={'rc':p.returncode,'class':c,'first_error':next((x for x in log.splitlines() if 'error' in x.lower()),'')}
          pathlib.Path('v145_arms.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n'); print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Protected suite
        run: |
          set +e
          lake build > v145_build.log 2>&1; B=$?
          lake test > v145_test.log 2>&1; T=$?
          set -e
          printf '{"build":%s,"test":%s}\n' "$B" "$T" > v145_protected.json
          [ "$B" -eq 0 ] && [ "$T" -eq 0 ]
      - name: Frozen verdict
        run: |
          python - <<'PY'
          import json,pathlib
          a=json.loads(pathlib.Path('v145_arms.json').read_text()); p=json.loads(pathlib.Path('v145_protected.json').read_text()); c=lambda k:a[k]['class']
          g={'B_direct':c('B')=='NON_FVAR_APPLICABILITY','L_let':c('L')=='PASS','LS_synth':c('LS')=='PASS','G_symbolic':c('G')=='SYMBOLIC_INSTANCE','protected':p['build']==0 and p['test']==0}
          if any(c(k)=='R10_APPARATUS' for k in a): v='R10_INCONCLUSIVE'
          elif all(g.values()): v='REJECT_K6_LET_BOUND_OLD_CLOSURE_SUFFICES'
          elif g['B_direct'] and g['G_symbolic'] and g['protected']: v='K6_REMAINS_LICENSED_AFTER_LET_CLOSURE'
          else: v='INCONCLUSIVE_CONTROL_FAILURE'
          r={'canonical_id':'V145_LET_BOUND_OLD_CLOSURE','arms':a,'gates':g,'protected':p,'verdict':v,'claim_boundary':'No constructor-development claim.'}
          pathlib.Path('v145_result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n'); print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Diagnostics
        if: always()
        run: |
          for f in v145_[BLG]*.log; do [ -e "$f" ] && { echo =====$f=====; cat "$f"; }; done
          cat v145_result.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v145-let-bound-old-closure
          path: v145_*
